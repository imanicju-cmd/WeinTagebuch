<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weintagebuch">
<meta name="theme-color" content="#1a1209">
<title>Weintagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #faf8f4;
  --bg2: #f3efe8;
  --bg3: #ebe5da;
  --ink: #1a1209;
  --ink2: #6b5c47;
  --ink3: #a8957c;
  --wine: #7a1c2e;
  --wine2: #a02840;
  --gold: #b8860b;
  --gold2: #d4a017;
  --green: #2d5a27;
  --border: rgba(26,18,9,0.12);
  --border2: rgba(26,18,9,0.22);
  --shadow: 0 1px 8px rgba(26,18,9,0.08);
  --r: 10px;
  --r2: 16px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #140f09;
    --bg2: #1e1710;
    --bg3: #2a2118;
    --ink: #f0e8d8;
    --ink2: #b8a48a;
    --ink3: #7a6a55;
    --border: rgba(240,232,216,0.1);
    --border2: rgba(240,232,216,0.2);
    --shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--ink)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;padding-top:max(12px, env(safe-area-inset-top))}
.topbar-title{font-family:var(--font-display);font-size:20px;font-weight:500;flex:1;color:var(--ink);font-style:italic}
.topbar-logo{font-family:var(--font-display);font-size:22px;font-weight:600;flex:1;color:var(--ink);letter-spacing:-0.5px}
.topbar-logo span{color:var(--wine)}

/* BUTTONS */
.btn{font-family:var(--font-body);background:transparent;border:0.5px solid var(--border2);border-radius:var(--r);padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:0.2px}
.btn:active{transform:scale(0.97)}
.btn-wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn-wine:active{background:var(--wine2)}
.btn-icon{padding:7px;border-radius:var(--r)}
.btn-ghost{border-color:transparent}

/* SCROLLABLE BODY */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-body::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
.bottom-nav{display:flex;border-top:0.5px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:max(8px, env(safe-area-inset-bottom))}
.bnav-btn{flex:1;padding:10px 4px 8px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:500;color:var(--ink3);letter-spacing:0.4px;text-transform:uppercase;font-family:var(--font-body)}
.bnav-btn.active{color:var(--wine)}
.bnav-btn i{font-size:20px}

/* STATS */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:0.5px solid var(--border);flex-shrink:0}
.stat-item{padding:12px 8px;text-align:center;border-right:0.5px solid var(--border)}
.stat-item:last-child{border-right:none}
.stat-num{font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--wine);display:block;line-height:1}
.stat-label{font-size:9px;color:var(--ink3);margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}

/* FILTERS */
.filter-row{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;border-bottom:0.5px solid var(--border);flex-shrink:0}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{font-family:var(--font-body);font-size:11px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:400;transition:all .15s}
.filter-chip.active{background:var(--wine);color:#fff;border-color:var(--wine)}
select.filter-chip{-webkit-appearance:none;appearance:none;padding-right:20px;background-image:none}

/* SEARCH */
.search-row{padding:10px 14px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink3)}
.search-input{width:100%;font-family:var(--font-body);font-size:13px;padding:8px 12px 8px 32px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--ink)}
.search-input:focus{outline:none;border-color:var(--wine);background:var(--bg)}

/* WINE GRID */
.wine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
.wine-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .15s}
.wine-card:active{transform:scale(0.98);border-color:var(--border2)}
.wine-thumb{width:100%;height:100px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.wine-thumb img{width:100%;height:100%;object-fit:cover}
.wine-thumb-icon{font-size:30px;color:var(--ink3)}
.wine-card-body{padding:9px 11px 11px}
.wine-card-name{font-family:var(--font-display);font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);margin-bottom:3px}
.wine-card-sub{font-size:10px;color:var(--ink3);margin-bottom:6px;line-height:1.4}
.wine-card-foot{display:flex;align-items:center;justify-content:space-between}
.stars-sm{color:var(--gold);font-size:10px;letter-spacing:0.5px}
.type-badge{font-size:9px;padding:2px 6px;border-radius:20px;background:var(--bg3);color:var(--ink2);font-weight:500}
.ripeness-dot{width:7px;height:7px;border-radius:50%;display:inline-block;vertical-align:middle;margin-left:3px}
.rd-now{background:#2d5a27}.rd-soon{background:#b8860b}.rd-wait{background:#185fa5}.rd-over{background:#a32d2d}

/* DETAIL */
.detail-hero{width:100%;height:200px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero-icon{font-size:60px;color:var(--ink3)}
.detail-body{padding:18px 16px 32px}
.detail-name{font-family:var(--font-display);font-size:26px;font-weight:500;font-style:italic;color:var(--ink);margin-bottom:4px;line-height:1.2}
.detail-origin{font-size:13px;color:var(--ink2);margin-bottom:12px}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500}
.tag-r{background:#E1F5EE;color:#085041}.tag-v{background:#EEEDFE;color:#3C3489}
.tag-g{background:#FAEEDA;color:#633806}.tag-t{background:rgba(122,28,46,0.1);color:var(--wine)}
.tag-k{background:#EAF3DE;color:#27500A}
.detail-stars{font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.section-label{font-size:9px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;margin-top:16px}
.section-text{font-size:13px;color:var(--ink);line-height:1.7}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.detail-stat{background:var(--bg2);border-radius:var(--r);padding:10px 12px;text-align:center}
.detail-stat-n{font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--wine)}
.detail-stat-l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.experience-box{background:var(--bg2);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.exp-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:3px 0}
.exp-row i{font-size:14px;color:var(--ink3);flex-shrink:0}

/* ADD FORM */
.add-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.add-scroll::-webkit-scrollbar{display:none}
.form-section{padding:14px 16px;border-bottom:0.5px solid var(--border)}
.form-section-title{font-family:var(--font-display);font-size:15px;font-weight:500;font-style:italic;color:var(--ink2);margin-bottom:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.form-group{margin-bottom:10px}
.form-label{font-size:10px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;display:block}
.form-input{font-family:var(--font-body);font-size:13px;padding:8px 11px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--ink);width:100%}
.form-input:focus{outline:none;border-color:var(--wine);background:var(--bg)}
.form-textarea{resize:none;min-height:80px;font-family:var(--font-body)}

/* PHOTO UPLOAD */
.photo-zone{border:1.5px dashed var(--border2);border-radius:var(--r2);padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2)}
.photo-zone:active{border-color:var(--wine)}
.photo-zone-icon{font-size:28px;color:var(--ink3);display:block;margin-bottom:6px}
.photo-zone-text{font-size:12px;color:var(--ink2)}
.photo-zone-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink3);border:0.5px solid var(--border);border-radius:20px;padding:2px 8px;margin-top:6px}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--r);display:none;margin-top:10px}

/* AI */
.ai-loading{display:none;align-items:center;gap:8px;padding:9px 12px;background:var(--bg2);border-radius:var(--r);font-size:11px;color:var(--ink2)}
.ai-loading.show{display:flex}
.ai-result{background:var(--bg2);border-radius:var(--r);padding:10px 12px;display:none;margin-top:8px}
.ai-result.show{display:block}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.ai-field{background:var(--bg);border-radius:6px;border:0.5px solid var(--border);padding:6px 8px}
.ai-field-l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.4px}
.ai-field-v{font-size:11px;font-weight:500;color:var(--ink);margin-top:1px}
.dots span{animation:blink 1.2s infinite;opacity:0}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* STARS RATING */
.star-row{display:flex;gap:4px}
.star-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:2px;color:var(--border2);transition:color .1s}
.star-btn.lit{color:var(--gold)}

/* RIPENESS BAR */
.ripe-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--ink3);margin-top:8px}
.ripe-legend-item{display:flex;align-items:center;gap:4px}

/* MAP */
.map-wrap{padding:14px}
.map-country-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r2);margin-bottom:10px;overflow:hidden}
.map-country-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--bg2)}
.map-country-flag{font-size:22px}
.map-country-name{font-family:var(--font-display);font-size:16px;font-weight:500;font-style:italic;flex:1;color:var(--ink)}
.map-country-count{font-size:11px;color:var(--ink3)}
.map-country-wines{display:none;padding:0 14px 12px}
.map-country-wines.open{display:block}
.map-region-item{border-top:0.5px solid var(--border);padding:10px 0}
.map-region-name{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px}
.map-region-meta{font-size:10px;color:var(--ink3);margin-bottom:6px}
.map-region-wines-list{display:flex;flex-direction:column;gap:4px}
.map-wine-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:3px 0;cursor:pointer}
.map-wine-row:active{color:var(--wine)}

/* MAP SVG */
.world-map-container{border:0.5px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:14px;background:#dde8f0;height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.wm-note{font-size:11px;color:var(--ink3);text-align:center;padding:0 20px;line-height:1.5}

/* EXPORT */
.export-section{padding:14px}
.export-title-row{font-family:var(--font-display);font-size:18px;font-style:italic;color:var(--ink);margin-bottom:14px}
.export-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.export-icon{width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.export-info{flex:1}
.export-name{font-size:13px;font-weight:500;color:var(--ink)}
.export-desc{font-size:10px;color:var(--ink3);margin-top:2px}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--ink3)}
.empty i{font-size:44px;display:block;margin-bottom:12px;opacity:.3}
.empty-title{font-family:var(--font-display);font-size:18px;font-style:italic;color:var(--ink2);margin-bottom:6px}
.empty-sub{font-size:12px;line-height:1.6}

/* RIPENESS */
.ripe-bar{height:4px;border-radius:2px;background:var(--bg3);overflow:hidden;margin-top:6px}
.ripe-fill{height:100%;border-radius:2px;transition:width .3s}
</style>
</head>
<body>
<div id="app">

<!-- LIST SCREEN -->
<div id="screen-list" class="screen active">
  <div class="topbar">
    <div class="topbar-logo">Wein<span>buch</span></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:5px;cursor:pointer" onclick="gapi&&gapi.client&&gapi.client.getToken()?disconnectDrive():connectDrive()" title="Google Drive Sync">
        <span id="sync-dot" style="width:7px;height:7px;border-radius:50%;background:#d0c8bc;flex-shrink:0;transition:background .3s"></span>
        <span id="sync-btn" style="font-size:10px;color:var(--ink3);font-family:var(--font-body)">Drive</span>
      </div>
      <button class="btn btn-wine" onclick="goAdd()"><i class="ti ti-plus"></i> Eintragen</button>
    </div>
  </div>
  <div id="stats-strip" class="stats-strip"></div>
  <div id="liste-header">
    <div class="search-row">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="sinput" placeholder="Wein, Region, Notizen…" oninput="filterWines()">
      </div>
    </div>
    <div class="filter-row" id="filter-row"></div>
  </div>
  <div id="tab-liste" class="scroll-body"><div id="wine-grid" class="wine-grid"></div></div>
  <div id="tab-karte" class="scroll-body" style="display:none"><div id="karte-content" class="map-wrap"></div></div>
  <div id="tab-export" class="scroll-body" style="display:none"><div id="export-content"></div></div>
  <div class="bottom-nav">
    <button class="bnav-btn active" id="bnav-liste" onclick="switchMainTab('liste')"><i class="ti ti-layout-grid"></i>Liste</button>
    <button class="bnav-btn" id="bnav-karte" onclick="switchMainTab('karte')"><i class="ti ti-map-2"></i>Karte</button>
    <button class="bnav-btn" id="bnav-export" onclick="switchMainTab('export')"><i class="ti ti-download"></i>Export</button>
  </div>
</div>

<!-- DETAIL SCREEN -->
<div id="screen-detail" class="screen">
  <div class="topbar">
    <button class="btn-icon btn btn-ghost" onclick="goList()"><i class="ti ti-arrow-left"></i></button>
    <div class="topbar-title" id="detail-topbar"></div>
    <button class="btn btn-ghost btn-icon" onclick="deleteWine()" style="color:#a32d2d;border-color:rgba(163,45,45,0.3)"><i class="ti ti-trash"></i></button>
  </div>
  <div class="scroll-body">
    <div id="detail-content"></div>
  </div>
</div>

<!-- ADD SCREEN -->
<div id="screen-add" class="screen">
  <div class="topbar">
    <button class="btn-icon btn btn-ghost" onclick="goList()"><i class="ti ti-x"></i></button>
    <div class="topbar-title">Neuer Eintrag</div>
    <button class="btn btn-wine" onclick="saveWine()"><i class="ti ti-check"></i> Speichern</button>
  </div>
  <div class="add-scroll">
    <!-- FOTO -->
    <div class="form-section">
      <div class="form-section-title">Etikett-Foto</div>
      <label class="photo-zone" for="photo-input">
        <i class="ti ti-camera photo-zone-icon"></i>
        <div class="photo-zone-text">Foto aufnehmen oder hochladen</div>
        <div class="photo-zone-badge"><i class="ti ti-sparkles" style="font-size:11px"></i> KI erkennt automatisch</div>
      </label>
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhoto(event)">
      <img id="photo-preview" class="photo-preview" alt="Etikett Vorschau">
      <div class="ai-loading" id="ai-loading" style="margin-top:8px"><i class="ti ti-sparkles"></i><span>KI analysiert das Etikett<span class="dots"><span>.</span><span>.</span><span>.</span></span></span></div>
      <div class="ai-result" id="ai-result">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:10px;font-weight:500;color:var(--ink3);display:flex;align-items:center;gap:4px"><i class="ti ti-sparkles" style="font-size:11px"></i> KI-Erkennung</div>
          <button class="btn" style="font-size:10px;padding:4px 10px" onclick="applyAi()"><i class="ti ti-check"></i> Übernehmen</button>
        </div>
        <div id="ai-grid" class="ai-grid"></div>
      </div>
    </div>
    <!-- WEIN -->
    <div class="form-section">
      <div class="form-section-title">Wein</div>
      <div class="form-group"><label class="form-label">Weingut / Name *</label><input class="form-input" id="f-name" placeholder="z.B. Barolo Monfortino, André Clouet…"></div>
      <div class="form-row">
        <div><label class="form-label">Jahrgang</label><input class="form-input" id="f-vintage" placeholder="2019" maxlength="4" type="number"></div>
        <div><label class="form-label">Art</label><select class="form-input" id="f-type"><option>Rotwein</option><option>Weißwein</option><option>Rosé</option><option>Schaumwein</option><option>Süßwein</option><option>Portwein</option><option>Sonstiges</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">Rebsorte(n)</label><input class="form-input" id="f-grape" placeholder="z.B. Nebbiolo, Chardonnay…"></div>
      <div class="form-row">
        <div><label class="form-label">Alkohol (%)</label><input class="form-input" id="f-alc" placeholder="13.5" type="number" step="0.1"></div>
        <div><label class="form-label">Format</label><select class="form-input" id="f-format"><option>Flasche (0,75L)</option><option>Magnum (1,5L)</option><option>Glas</option><option>Halbe (0,375L)</option><option>Jeroboam (3L)</option><option>Sonstiges</option></select></div>
      </div>
    </div>
    <!-- HERKUNFT -->
    <div class="form-section">
      <div class="form-section-title">Herkunft</div>
      <div class="form-row">
        <div><label class="form-label">Land</label><input class="form-input" id="f-country" placeholder="z.B. Frankreich"></div>
        <div><label class="form-label">Anbaugebiet</label><input class="form-input" id="f-region" placeholder="z.B. Burgund"></div>
      </div>
      <div class="form-row">
        <div><label class="form-label">Lage / Appellation</label><input class="form-input" id="f-lage" placeholder="z.B. Vosne-Romanée"></div>
        <div><label class="form-label">Klassifikation</label><input class="form-input" id="f-klass" placeholder="z.B. Premier Cru"></div>
      </div>
    </div>
    <!-- TRINKREIFE -->
    <div class="form-section">
      <div class="form-section-title">Trinkreife</div>
      <div class="form-row">
        <div><label class="form-label">Trinken ab</label><input class="form-input" id="f-from" placeholder="2024" type="number" maxlength="4"></div>
        <div><label class="form-label">Trinken bis</label><input class="form-input" id="f-to" placeholder="2035" type="number" maxlength="4"></div>
      </div>
    </div>

<script>
// IndexedDB setup
let db;
const DB_NAME='weinbuch';const DB_VER=1;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('wines'))d.createObjectStore('wines',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=()=>rej(req.error);
  });
}
function dbGet(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).put(val);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbDelete(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).delete(id);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}

async function init(){
  await openDB();
  const stored=await dbGetAll('wines');
  if(stored.length>0){wines=stored.sort((a,b)=>b.id-a.id);}
  else{wines=[...DEMO];for(const w of DEMO)await dbPut('wines',w);}

function ripeDot(w){
  const f=parseInt(w.drinkFrom)||0,t=parseInt(w.drinkTo)||9999,n=2025;
  if(!w.drinkFrom&&!w.drinkTo)return'';
  if(n<f)return`<span class="ripeness-dot rd-wait" title="Noch warten"></span>`;
  if(n>t)return`<span class="ripeness-dot rd-over" title="Überlagert"></span>`;
  if(t-n<=2)return`<span class="ripeness-dot rd-soon" title="Bald trinken"></span>`;
  return`<span class="ripeness-dot rd-now" title="Jetzt trinken"></span>`;
}

async function renderGrid(list){
  const grid=document.getElementById('wine-grid');
  if(!list||!list.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><i class="ti ti-wine"></i><div class="empty-title">Noch keine Weine</div><div class="empty-sub">Tippe auf „Eintragen" um deinen ersten Wein hinzuzufügen</div></div>`;
    return;
  }
  const items=await Promise.all(list.map(async w=>{
    let imgHtml=`<div class="wine-thumb"><i class="ti ti-bottle wine-thumb-icon"></i></div>`;
    const photo=await dbGet('photos',w.id);
    if(photo)imgHtml=`<div class="wine-thumb"><img src="${photo.data}" alt="Etikett" loading="lazy"></div>`;
    return`<div class="wine-card" onclick="goDetail(${w.id})">${imgHtml}<div class="wine-card-body"><div class="wine-card-name">${w.name}${ripeDot(w)}</div><div class="wine-card-sub">${[w.vintage,w.country].filter(Boolean).join(' · ')||'—'}</div><div class="wine-card-foot"><span class="stars-sm">${'★'.repeat(w.rating)}</span>${w.type?`<span class="type-badge">${w.type}</span>`:''}</div></div></div>`;

}

function renderStats(){

function renderFilters(){

    <select class="filter-chip" id="f-ra" onchange="filterWines()"><option value="">Bewertung</option><option value="5">★★★★★</option><option value="4">★★★★+</option><option value="3">★★★+</option></select>`;
}

function filterWines(){
  const q=(document.getElementById('sinput')?.value||'').toLowerCase();
  const yr=document.getElementById('f-yr')?.value||'';
  const co=document.getElementById('f-co')?.value||'';
  const ty=document.getElementById('f-ty')?.value||'';
  const ra=parseInt(document.getElementById('f-ra')?.value)||0;
  const filtered=wines.filter(w=>{
    if(q&&![w.name,w.region,w.grape,w.notes,w.country,w.withwho,w.ort,w.lage,w.klass].join(' ').toLowerCase().includes(q))return false;
    if(yr&&w.vintage!==yr)return false;
    if(co&&w.country!==co)return false;
    if(ty&&w.type!==ty)return false;
    if(ra&&w.rating<ra)return false;
    return true;
  });
  renderGrid(filtered);
}

          ${w.ort?`<div class="exp-row"><i class="ti ti-map-pin"></i><span>${w.ort}</span></div>`:''}
          ${w.withwho?`<div class="exp-row"><i class="ti ti-users"></i><span>${w.withwho}</span></div>`:''}

        ${w.alc?`<div class="detail-stat"><div class="detail-stat-n">${w.alc}%</div><div class="detail-stat-l">Alkohol</div></div>`:''}

const ISO_NAMES={'250':'Frankreich','276':'Deutschland','380':'Italien','724':'Spanien','620':'Portugal','40':'Österreich','300':'Griechenland','348':'Ungarn','840':'USA','152':'Chile','32':'Argentinien','710':'Südafrika','36':'Australien','554':'Neuseeland','756':'Schweiz','076':'Brasilien','858':'Uruguay','268':'Georgien','051':'Armenien','792':'Türkei','191':'Kroatien','705':'Slowenien','100':'Bulgarien','642':'Rumänien','376':'Israel','504':'Marokko','788':'Tunesien','124':'Kanada','484':'Mexiko','604':'Peru'};
const NAME_ISO={};Object.entries(ISO_NAMES).forEach(([k,v])=>{NAME_ISO[v]=k;});
let d3Loaded=false;let topoLoaded=false;let worldData=null;

function renderMapView(el){
  el.innerHTML=`
    <div style="position:relative">
      <div id="map-svg-container" style="width:100%;height:280px;background:#c8dce8;overflow:hidden;position:relative;touch-action:none">
        <div id="map-loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#7a8a95;flex-direction:column;gap:8px"><i class="ti ti-map-2" style="font-size:28px;opacity:.4"></i>Weltkarte lädt…</div>
      </div>
      <div id="map-back-btn" style="position:absolute;top:10px;left:10px;display:none">
        <button class="btn" style="font-size:11px;padding:5px 10px;background:rgba(250,248,244,0.92)" onclick="mapZoomOut()"><i class="ti ti-arrow-left"></i> Zurück</button>
      </div>
    </div>
    <div style="display:flex;gap:12px;padding:8px 14px;border-bottom:0.5px solid var(--border)">
      <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink3)"><span style="width:10px;height:10px;border-radius:50%;background:var(--wine);display:inline-block"></span>Weine vorhanden</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink3)"><span style="width:10px;height:10px;background:#d8cfc5;display:inline-block;border-radius:2px"></span>Noch keine</div>
    </div>
    <div id="map-country-list" style="padding:10px 14px 0"></div>`;
  loadD3AndDraw();
}

function loadD3AndDraw(){
  if(d3Loaded&&topoLoaded&&worldData){drawWorldMap();return;}
  if(!d3Loaded){
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';
    s.onload=()=>{d3Loaded=true;loadTopo();};document.head.appendChild(s);
  } else loadTopo();
}
function loadTopo(){
  if(!topoLoaded){
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js';
    s.onload=()=>{topoLoaded=true;fetchWorld();};document.head.appendChild(s);
  } else fetchWorld();
}
function fetchWorld(){
  if(worldData){drawWorldMap();return;}
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json()).then(data=>{worldData=data;drawWorldMap();})
    .catch(()=>{const l=document.getElementById('map-loading');if(l)l.textContent='Karte konnte nicht geladen werden.';});
}

function getCountryWines(){
  const cw={};wines.forEach(w=>{const c=w.country||'Unbekannt';if(!cw[c])cw[c]=[];cw[c].push(w);});return cw;
}

let _mapSvg=null;let _mapZoom=null;let _mapG=null;let _mapProjection=null;let _mapPath=null;

function drawWorldMap(){
  const container=document.getElementById('map-svg-container');if(!container)return;
  const loading=document.getElementById('map-loading');if(loading)loading.style.display='none';
  const W=container.offsetWidth||360;const H=280;
  const countryWines=getCountryWines();
  const wineIsos=new Set(Object.keys(countryWines).map(n=>NAME_ISO[n]).filter(Boolean));

  container.innerHTML='';
  const svg=d3.select(container).append('svg').attr('width',W).attr('height',H).style('display','block');
  _mapSvg=svg;
  const projection=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  _mapProjection=projection;
  const path=d3.geoPath().projection(projection);
  _mapPath=path;
  const zoom=d3.zoom().scaleExtent([1,10]).on('zoom',e=>{g.attr('transform',e.transform);});
  _mapZoom=zoom;
  svg.call(zoom);
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#c8dce8');
  const g=svg.append('g');
  _mapG=g;

  const countries=topojson.feature(worldData,worldData.objects.countries);

  g.selectAll('path.country')
    .data(countries.features)
    .join('path')
    .attr('class','country')
    .attr('d',path)
    .attr('fill',d=>{
      const iso=String(d.id);
      return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'#7a1c2e':'#d8cfc5';
    })
    .attr('stroke','#fff')
    .attr('stroke-width',0.4)
    .style('cursor',d=>{
      const iso=String(d.id);
      return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'pointer':'default';
    })
    .on('click',(event,d)=>{
      const iso=String(d.id);
      const name=ISO_NAMES[iso]||ISO_NAMES[iso.padStart(3,'0')];
      if(!name||!countryWines[name])return;
      zoomToCountry(d,name,path,svg,g,zoom,W,H,countryWines);
    });

  // White dot markers on wine countries
  g.selectAll('circle.wine-marker')
    .data(countries.features.filter(d=>{const iso=String(d.id);return wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0'));}))
    .join('circle')
    .attr('class','wine-marker')
    .attr('cx',d=>{try{const c=path.centroid(d);return isNaN(c[0])?0:c[0];}catch(e){return 0;}})
    .attr('cy',d=>{try{const c=path.centroid(d);return isNaN(c[1])?0:c[1];}catch(e){return 0;}})
    .attr('r',4).attr('fill','#fff').attr('stroke','#7a1c2e').attr('stroke-width',1.5)
    .style('pointer-events','none');

  renderCountryList(countryWines);
}

function zoomToCountry(feature,countryName,path,svg,g,zoom,W,H,countryWines){
  try{
    const [[x0,y0],[x1,y1]]=path.bounds(feature);
    if(isNaN(x0))return;
    const dx=x1-x0,dy=y1-y0;
    const cx=(x0+x1)/2,cy=(y0+y1)/2;
    const scale=Math.min(8,0.8/Math.max(dx/W,dy/H));
    svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2-scale*cx,H/2-scale*cy).scale(scale));
    const backBtn=document.getElementById('map-back-btn');if(backBtn)backBtn.style.display='block';
    setTimeout(()=>{
      document.querySelectorAll('.map-country-card').forEach(card=>{
        if(card.dataset.country===countryName){
          card.querySelector('.map-country-wines').classList.add('open');
          card.scrollIntoView({behavior:'smooth',block:'start'});
        }
      });
    },500);
  }catch(e){}
}

function mapZoomOut(){
  if(_mapSvg&&_mapZoom){
    const container=document.getElementById('map-svg-container');
    const W=container?.offsetWidth||360;const H=280;
    _mapSvg.transition().duration(500).call(_mapZoom.transform,d3.zoomIdentity);
  }
  const backBtn=document.getElementById('map-back-btn');if(backBtn)backBtn.style.display='none';
}

function renderCountryList(countryWines){

let currentPhotoB64=null;
async function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    currentPhotoB64=ev.target.result;
    const prev=document.getElementById('photo-preview');prev.src=currentPhotoB64;prev.style.display='block';
    document.getElementById('ai-loading').classList.add('show');
    document.getElementById('ai-result').classList.remove('show');
    const b64=currentPhotoB64.split(',')[1];
    const mt=currentPhotoB64.split(';')[0].split(':')[1]||'image/jpeg';
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:700,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mt,data:b64}},
          {type:'text',text:`Analysiere dieses Weinetikett. Antworte NUR mit einem JSON-Objekt, kein Markdown:
{"name":"Weingut + Weinname","vintage":"Jahrgang 4-stellig oder NV","type":"Rotwein|Weißwein|Rosé|Schaumwein|Süßwein|Portwein|Sonstiges","grape":"Rebsorte(n)","alc":"Alkohol als Zahl","country":"Herkunftsland auf Deutsch","region":"Anbaugebiet","lage":"Lage oder Appellation","klass":"Klassifikation z.B. Grand Cru","notes":"2-3 Sätze Beschreibung auf Deutsch"}
Leere Strings wenn nicht erkennbar.`}
        ]}]})});
      const d=await resp.json();
      const txt=d.content?.filter(b=>b.type==='text').map(b=>b.text).join('');
      aiData=JSON.parse(txt.replace(/```json|```/g,'').trim());
      const fields=[['name','Name'],['vintage','Jahrgang'],['country','Land'],['region','Anbaugebiet'],['lage','Lage'],['type','Art'],['grape','Rebsorte'],['alc','Alkohol']];
      document.getElementById('ai-grid').innerHTML=fields.filter(([k])=>aiData[k]).map(([k,l])=>`<div class="ai-field"><div class="ai-field-l">${l}</div><div class="ai-field-v">${aiData[k]}</div></div>`).join('');
      document.getElementById('ai-result').classList.add('show');
    }catch(err){
      document.getElementById('ai-result').innerHTML='<div style="font-size:11px;color:var(--ink3)">Etikett nicht erkannt — bitte manuell eintragen.</div>';
      document.getElementById('ai-result').classList.add('show');
    }
    document.getElementById('ai-loading').classList.remove('show');
  };
  reader.readAsDataURL(file);
}

function applyAi(){
  if(!aiData)return;
  const m={'name':'f-name','vintage':'f-vintage','grape':'f-grape','alc':'f-alc','country':'f-country','region':'f-region','lage':'f-lage','klass':'f-klass','notes':'f-notes'};
  Object.entries(m).forEach(([k,id])=>{if(aiData[k]){const e=document.getElementById(id);if(e)e.value=aiData[k];}});

async function importJson(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)&&d.length>0){
        if(confirm(`${d.length} Weine importieren?`)){
          for(const w of d)await dbPut('wines',w);
          wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
          goList();alert('Import erfolgreich!');
        }
      }
    }catch{alert('Ungültige Datei');}
  };
  r.readAsText(file);
}

// ── Google Drive Sync ──────────────────────────────────────────────
const GAPI_CLIENT_ID='399210738927-kr0dkpovdkrr8ugiqv7vcr43oggagjj2.apps.googleusercontent.com';
const GAPI_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME='weinbuch-data.json';
let gapiReady=false;let gisReady=false;let tokenClient=null;let driveFileId=null;

function loadGoogleLibs(){
  const s1=document.createElement('script');s1.src='https://apis.google.com/js/api.js';
  s1.onload=()=>{gapi.load('client',async()=>{await gapi.client.init({});gapiReady=true;checkSyncReady();});};
  document.head.appendChild(s1);
  const s2=document.createElement('script');s2.src='https://accounts.google.com/gsi/client';
  s2.onload=()=>{tokenClient=google.accounts.oauth2.initTokenClient({client_id:GAPI_CLIENT_ID,scope:GAPI_SCOPE,callback:onTokenResponse});gisReady=true;checkSyncReady();};
  document.head.appendChild(s2);
}

function checkSyncReady(){
  if(gapiReady&&gisReady){
    updateSyncUI('bereit');
    const saved=localStorage.getItem('wt_gdrive_token');
    if(saved){gapi.client.setToken(JSON.parse(saved));updateSyncUI('verbunden');syncFromDrive();}
  }
}

function onTokenResponse(resp){
  if(resp.error){updateSyncUI('fehler');return;}
  localStorage.setItem('wt_gdrive_token',JSON.stringify(gapi.client.getToken()));
  updateSyncUI('verbunden');
  syncFromDrive();
}

function connectDrive(){
  if(!gapiReady||!gisReady){alert('Google lädt noch, kurz warten.');return;}
  tokenClient.requestAccessToken({prompt:'consent'});
}

function disconnectDrive(){
  const token=gapi.client.getToken();
  if(token){google.accounts.oauth2.revoke(token.access_token,()=>{});}
  gapi.client.setToken(null);
  localStorage.removeItem('wt_gdrive_token');
  driveFileId=null;
  updateSyncUI('bereit');
}

async function syncToDrive(){
  if(!gapi.client.getToken()){return;}
  updateSyncUI('sync');
  try{
    const data=JSON.stringify(wines);
    const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder']};
    if(!driveFileId)await findDriveFile();
    if(driveFileId){
      await gapi.client.request({path:`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}`,method:'PATCH',params:{uploadType:'media'},body:data,headers:{'Content-Type':'application/json'}});
    } else {
      const boundary='weinbuch_boundary';
      const body=`--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${boundary}--`;
      const resp=await gapi.client.request({path:'https://www.googleapis.com/upload/drive/v3/files',method:'POST',params:{uploadType:'multipart'},body,headers:{'Content-Type':`multipart/related; boundary=${boundary}`}});
      driveFileId=resp.result.id;
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('fehler');
  }
}

async function syncFromDrive(){
  if(!gapi.client.getToken())return;
  updateSyncUI('sync');
  try{
    await findDriveFile();
    if(!driveFileId){updateSyncUI('verbunden');return;}
    const resp=await gapi.client.request({path:`https://www.googleapis.com/drive/v3/files/${driveFileId}`,params:{alt:'media'}});
    const driveWines=typeof resp.result==='string'?JSON.parse(resp.result):resp.result;
    if(Array.isArray(driveWines)&&driveWines.length>0){
      const localIds=new Set(wines.map(w=>w.id));
      const toAdd=driveWines.filter(w=>!localIds.has(w.id));
      for(const w of toAdd)await dbPut('wines',w);
      if(toAdd.length>0){
        wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
        renderAll();
      }
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('verbunden');
  }
}

async function findDriveFile(){
  const resp=await gapi.client.request({path:'https://www.googleapis.com/drive/v3/files',params:{spaces:'appDataFolder',q:`name='${DRIVE_FILE_NAME}'`,fields:'files(id,name)'}});
  const files=resp.result.files||[];
  driveFileId=files.length>0?files[0].id:null;
}

function updateSyncUI(state){
  const btn=document.getElementById('sync-btn');
  const dot=document.getElementById('sync-dot');
  if(!btn||!dot)return;
  const states={
    bereit:{dot:'#b8860b',label:'Drive verbinden',disabled:false},
    verbunden:{dot:'#2d5a27',label:'Drive verbunden',disabled:false},
    sync:{dot:'#185fa5',label:'Synchronisiert…',disabled:true},
    ok:{dot:'#2d5a27',label:'Gespeichert ✓',disabled:false},
    fehler:{dot:'#a32d2d',label:'Fehler',disabled:false},
  };
  const s=states[state]||states.bereit;
  dot.style.background=s.dot;
  btn.textContent=s.label;
  btn.disabled=s.disabled;
  if(state==='ok')setTimeout(()=>updateSyncUI('verbunden'),2500);
}
