<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weintagebuch">
<meta name="theme-color" content="#1a1209">
<title>Weintagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f3ec;
  --bg2: #ede8df;
  --bg3: #e0d9ce;
  --ink: #0f0d0a;
  --ink2: #4a4038;
  --ink3: #9a9088;
  --wine: #c0392b;
  --wine2: #96281b;
  --wine-pale: #fbecea;
  --accent1: #e8d5b0;
  --accent2: #c8ddc8;
  --border: rgba(15,13,10,0.1);
  --border2: rgba(15,13,10,0.2);
  --r: 16px;
  --r2: 22px;
  --r3: 32px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0d0a;
    --bg2: #1a1712;
    --bg3: #252018;
    --ink: #f2ede4;
    --ink2: #c0b8a8;
    --ink3: #706860;
    --wine-pale: #2a1210;
    --accent1: #2a2418;
    --accent2: #1a2418;
    --border: rgba(242,237,228,0.08);
    --border2: rgba(242,237,228,0.15);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--ink)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:14px 18px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
.topbar-title{font-size:15px;font-weight:500;flex:1;color:var(--ink);letter-spacing:-0.3px}
.topbar-logo{font-size:18px;font-weight:700;flex:1;color:var(--ink);letter-spacing:-1px;text-transform:lowercase}
.topbar-logo span{color:var(--wine)}

/* BUTTONS */
.btn{font-family:var(--font-body);background:transparent;border:1.5px solid var(--ink);border-radius:100px;padding:8px 18px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px;transition:all .12s;letter-spacing:0.3px;text-transform:uppercase}
.btn:active{transform:scale(0.96)}
.btn-wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn-wine:active{background:var(--wine2)}
.btn-dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-icon{padding:8px;border-radius:50%;border-width:1.5px}
.btn-ghost{border-color:transparent}

/* SCROLL */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-body::-webkit-scrollbar{display:none}

/* BOTTOM NAV — dark pill style */
.bottom-nav{display:flex;background:var(--ink);flex-shrink:0;padding:6px 8px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;margin:0 0}
.bnav-btn{flex:1;padding:10px 4px 6px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.6px;text-transform:uppercase;font-family:var(--font-body);border-radius:16px;transition:all .15s}
.bnav-btn.active{color:#fff;background:rgba(255,255,255,0.12)}
.bnav-btn i{font-size:20px}

/* STATS — colored blocks */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;flex-shrink:0}
.stat-item{background:var(--bg2);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat-item:first-child{background:var(--wine-pale)}
.stat-num{font-size:28px;font-weight:700;color:var(--ink);display:block;line-height:1;letter-spacing:-1px}
.stat-item:first-child .stat-num{color:var(--wine)}
.stat-label{font-size:8px;color:var(--ink3);margin-top:4px;text-transform:uppercase;letter-spacing:0.8px;font-weight:500}

/* FILTERS */
.filter-row{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;flex-shrink:0}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{font-family:var(--font-body);font-size:10px;padding:6px 14px;border-radius:100px;border:1.5px solid var(--border2);background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:500;transition:all .12s;letter-spacing:0.2px}
.filter-chip.active,.filter-chip:active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.filter-chip{-webkit-appearance:none;appearance:none}

/* SEARCH */
.search-row{padding:0 16px 10px;flex-shrink:0}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink3)}
.search-input{width:100%;font-family:var(--font-body);font-size:13px;padding:10px 14px 10px 36px;border:1.5px solid var(--border2);border-radius:100px;background:var(--bg2);color:var(--ink);font-weight:400}
.search-input:focus{outline:none;border-color:var(--ink);background:var(--bg)}
.search-input::placeholder{color:var(--ink3)}

/* WINE LIST — bold editorial rows */
.wine-list{display:flex;flex-direction:column;padding:4px 0}
.wine-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .1s}
.wine-row:active{background:var(--bg2)}
.wine-row-thumb{width:46px;height:58px;border-radius:12px;background:var(--bg2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.wine-row-thumb img{width:100%;height:100%;object-fit:cover}
.wine-row-thumb-icon{font-size:20px;color:var(--ink3)}
.wine-row-body{flex:1;min-width:0}
.wine-row-weingut{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px;font-weight:600}
.wine-row-name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.15;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.3px}
.wine-row-meta{font-size:10px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wine-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.type-badge{font-size:9px;padding:3px 9px;border-radius:100px;border:1px solid var(--border2);color:var(--ink3);white-space:nowrap;font-weight:500}
.type-badge-wine{background:var(--wine-pale);color:var(--wine);border-color:transparent}
.ripeness-dot{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle}
.rd-now{background:#3a7a28}.rd-soon{background:#c08010}.rd-wait{background:#2060a0}.rd-over{background:#a02020}

/* DETAIL */
.detail-hero{width:100%;height:240px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero-icon{font-size:64px;color:var(--ink3);opacity:.2}
.detail-body{padding:22px 18px 48px}
.detail-eyebrow{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;font-weight:600}
.detail-name{font-size:32px;font-weight:700;color:var(--ink);line-height:1.05;margin-bottom:4px;letter-spacing:-1px}
.detail-subname{font-family:var(--font-display);font-size:20px;color:var(--ink2);font-style:italic;margin-bottom:10px;font-weight:400}
.detail-origin{font-size:12px;color:var(--ink3);margin-bottom:18px;letter-spacing:0.2px}
.divider{height:0.5px;background:var(--border);margin:18px 0}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-size:10px;padding:4px 11px;border-radius:100px;font-weight:500;letter-spacing:0.2px}
.tag-r{background:var(--bg2);color:var(--ink2)}
.tag-v{background:var(--ink);color:var(--bg)}
.tag-g{background:var(--accent1);color:var(--ink2)}
.tag-t{background:var(--wine-pale);color:var(--wine)}
.tag-k{background:var(--accent2);color:var(--ink2)}
.detail-stars{font-size:22px;color:var(--wine);letter-spacing:3px;margin-bottom:18px}
.section-label{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;margin-top:20px}
.section-text{font-size:14px;color:var(--ink);line-height:1.75}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.detail-stat{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center}
.detail-stat-n{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.5px}
.detail-stat-l{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-top:4px;font-weight:600}
.experience-box{background:var(--bg2);border-radius:var(--r2);padding:16px;margin-top:8px}
.exp-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:5px 0;border-bottom:0.5px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.exp-row i{font-size:15px;color:var(--ink3);flex-shrink:0;width:18px}
.ripe-bar{height:4px;border-radius:4px;background:var(--bg3);overflow:hidden;margin-top:10px}
.ripe-fill{height:100%;border-radius:4px;transition:width .3s}

/* ADD FORM */
.add-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.add-scroll::-webkit-scrollbar{display:none}
.form-section{padding:20px 18px;border-bottom:0.5px solid var(--border)}
.form-section-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:-0.2px;text-transform:uppercase}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{margin-bottom:10px}
.form-label{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;display:block}
.form-input{font-family:var(--font-body);font-size:14px;padding:10px 14px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--ink);width:100%;transition:border-color .15s;font-weight:400}
.form-input:focus{outline:none;border-color:var(--ink)}
.form-textarea{resize:none;min-height:80px;font-family:var(--font-body);font-size:13px;line-height:1.6}

/* PHOTO */
.photo-zone{border:2px dashed var(--border2);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2)}
.photo-zone:active{border-color:var(--ink)}
.photo-zone-icon{font-size:28px;color:var(--ink3);display:block;margin-bottom:8px}
.photo-zone-text{font-size:12px;color:var(--ink2);font-weight:500}
.photo-zone-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--wine);border:1.5px solid var(--wine);border-radius:100px;padding:3px 12px;margin-top:10px;font-weight:600;letter-spacing:0.3px}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--r);display:none;margin-top:10px}

/* AI */
.ai-loading{display:none;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-radius:var(--r);font-size:11px;color:var(--ink2);font-weight:500}
.ai-loading.show{display:flex}
.ai-result{background:var(--bg2);border-radius:var(--r);padding:12px;display:none;margin-top:8px}
.ai-result.show{display:block}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ai-field{background:var(--bg);border-radius:10px;border:1px solid var(--border);padding:8px 10px}
.ai-field-l{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.6px;font-weight:700}
.ai-field-v{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
.dots span{animation:blink 1.2s infinite;opacity:0}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* STARS */
.star-row{display:flex;gap:6px}
.star-btn{background:none;border:none;font-size:28px;cursor:pointer;padding:2px;color:var(--border2);transition:color .1s}
.star-btn.lit{color:var(--wine)}

/* MAP hierarchy */
.map-country-card{background:var(--bg);border-bottom:0.5px solid var(--border);overflow:hidden}
.map-country-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer}
.map-country-flag{font-size:20px}
.map-country-name{font-size:15px;font-weight:700;flex:1;color:var(--ink);letter-spacing:-0.3px}
.map-country-count{font-size:10px;color:var(--ink3);font-weight:500}
.map-country-wines{display:none;padding:0 0 8px}
.map-country-wines.open{display:block}
.map-region-item{border-top:0.5px solid var(--border);padding:10px 18px 4px}
.map-region-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-0.2px;text-transform:uppercase;font-size:10px;color:var(--ink3)}
.map-weingut-block{margin-bottom:4px}
.map-weingut-name{display:flex;align-items:center;gap:7px;padding:9px 0;cursor:pointer;border-bottom:0.5px solid var(--border);font-size:13px;font-weight:700;color:var(--ink)}
.map-weingut-name span:first-of-type{flex:1}
.map-weingut-wines{display:none;padding-left:16px}
.map-weingut-wines.open{display:block}
.map-weinname-block{border-bottom:0.5px solid var(--border)}
.map-weinname-block:last-child{border-bottom:none}
.map-weinname-row{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
.map-weinname-label{font-size:13px;font-style:italic;color:var(--ink2);flex:1}
.map-vintage-list{display:none;padding-left:12px}
.map-vintage-list.open{display:block}
.map-vintage-row{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;border-bottom:0.5px solid var(--border)}
.map-vintage-row:last-child{border-bottom:none}
.map-vintage-row:active{background:var(--wine-pale)}
.map-vintage-chip{background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:0.3px}

/* TYPE TILES */
.type-tile{border-radius:var(--r2);padding:10px 8px;text-align:center;cursor:pointer;transition:all .12s;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px}
.type-tile:active{transform:scale(0.95)}
.type-tile.active{border-color:var(--ink)}
.type-tile-icon{font-size:20px}
.type-tile-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;line-height:1.2}
.type-tile-count{font-size:8px;opacity:.7}

/* HOME LISTS */
.home-list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);cursor:pointer;gap:6px}
.home-list-item:last-child{border-bottom:none}
.home-list-item:active{opacity:.6}
.home-list-name{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:-0.2px;line-height:1.3}
.home-list-sub{font-size:9px;color:var(--ink3);margin-top:1px}
.home-list-count{font-size:10px;font-weight:700;color:var(--wine);flex-shrink:0}

/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1.5px solid var(--ink);border-radius:var(--r);z-index:100;max-height:160px;overflow-y:auto;display:none;margin-top:2px;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.ac-dropdown.show{display:block}
.ac-item{padding:9px 14px;font-size:13px;color:var(--ink);cursor:pointer;border-bottom:0.5px solid var(--border);font-weight:400}
.ac-item:last-child{border-bottom:none}
.ac-item:active,.ac-item:hover{background:var(--bg2)}
.ac-item strong{color:var(--wine);font-weight:700}
.export-section{padding:18px}
.export-title-row{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:18px;letter-spacing:-0.5px}
.export-card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r2);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.export-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--bg2)}
.export-info{flex:1}
.export-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-0.2px}
.export-desc{font-size:10px;color:var(--ink3);margin-top:2px;font-weight:500}

/* EMPTY */
.empty{text-align:center;padding:56px 24px}
.empty i{font-size:44px;display:block;margin-bottom:14px;color:var(--border2)}
.empty-title{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:-0.5px}
.empty-sub{font-size:13px;line-height:1.7;color:var(--ink3)}
</style>
</head>
<body>
<div id="app">

<!-- LIST SCREEN -->
<div id="screen-list" class="screen active">
  <div class="topbar">
    <div class="topbar-logo">wein<span>buch</span></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:5px;cursor:pointer" onclick="gapi&&gapi.client&&gapi.client.getToken()?disconnectDrive():connectDrive()" title="Google Drive Sync">
        <span id="sync-dot" style="width:7px;height:7px;border-radius:50%;background:#d0c8bc;flex-shrink:0;transition:background .3s"></span>
        <span id="sync-btn" style="font-size:10px;color:var(--ink3);font-family:var(--font-body)">Drive</span>
      </div>
      <button class="btn btn-wine" onclick="goAdd()"><i class="ti ti-plus"></i> Eintragen</button>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="tab-home" class="scroll-body">
    <div id="stats-strip" class="stats-strip"></div>

    <!-- Weinart Kacheln -->
    <div style="padding:14px 16px 4px">
      <div style="font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">Weinart</div>
      <div id="type-tiles" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    </div>

    <!-- Länder & Weingüter -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;border-top:0.5px solid var(--border)">
      <!-- Länder -->
      <div style="border-right:0.5px solid var(--border);padding:14px 14px 6px">
        <div style="font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">Länder</div>
        <div id="country-list-home"></div>
      </div>
      <!-- Weingüter -->
      <div style="padding:14px 14px 6px">
        <div style="font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">Weingüter</div>
        <div id="weingut-list-home"></div>
      </div>
    </div>
    <div style="height:20px"></div>
  </div>

  <!-- LISTE TAB (filtered results) -->
  <div id="tab-liste" class="scroll-body" style="display:none">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0">
      <button class="btn btn-ghost btn-icon" onclick="backToHome()" style="padding:6px"><i class="ti ti-arrow-left" style="font-size:16px"></i></button>
      <div id="filter-label" style="font-size:14px;font-weight:700;color:var(--ink);flex:1;letter-spacing:-0.3px"></div>
      <div class="search-wrap" style="width:130px">
        <i class="ti ti-search"></i>
        <input class="search-input" id="sinput" placeholder="Suchen…" oninput="filterWines()" style="font-size:12px;padding:7px 10px 7px 30px">
      </div>
    </div>
    <div id="wine-grid" class="wine-list"></div>
  </div>

  <!-- KARTE TAB -->
  <div id="tab-karte" class="scroll-body" style="display:none"><div id="karte-content" class="map-wrap"></div></div>

  <!-- EXPORT TAB -->
  <div id="tab-export" class="scroll-body" style="display:none"><div id="export-content"></div></div>

  <div class="bottom-nav">
    <button class="bnav-btn active" id="bnav-home" onclick="switchMainTab('home')"><i class="ti ti-home"></i>Start</button>
    <button class="bnav-btn" id="bnav-liste" onclick="switchMainTab('liste')"><i class="ti ti-list"></i>Alle</button>

<script>
// IndexedDB setup
let db;
const DB_NAME='weinbuch';const DB_VER=1;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('wines'))d.createObjectStore('wines',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=()=>rej(req.error);
  });
}
function dbGet(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).put(val);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbDelete(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).delete(id);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}

let wines=[];let editRating=3;let currentId=null;let aiData=null;let activeMainTab='liste';
const COUNTRY_FLAGS={'Frankreich':'🇫🇷','Deutschland':'🇩🇪','Italien':'🇮🇹','Spanien':'🇪🇸','Portugal':'🇵🇹','Österreich':'🇦🇹','USA':'🇺🇸','Chile':'🇨🇱','Argentinien':'🇦🇷','Südafrika':'🇿🇦','Australien':'🇦🇺','Neuseeland':'🇳🇿','Griechenland':'🇬🇷','Ungarn':'🇭🇺'};
const DEMO=[

async function init(){
  await openDB();
  const stored=await dbGetAll('wines');
  if(stored.length>0){wines=stored.sort((a,b)=>b.id-a.id);}
  else{wines=[...DEMO];for(const w of DEMO)await dbPut('wines',w);}
  renderAll();
}

function ripeDot(w){
  const f=parseInt(w.drinkFrom)||0,t=parseInt(w.drinkTo)||9999,n=2025;
  if(!w.drinkFrom&&!w.drinkTo)return'';
  if(n<f)return`<span class="ripeness-dot rd-wait" title="Noch warten"></span>`;
  if(n>t)return`<span class="ripeness-dot rd-over" title="Überlagert"></span>`;
  if(t-n<=2)return`<span class="ripeness-dot rd-soon" title="Bald trinken"></span>`;
  return`<span class="ripeness-dot rd-now" title="Jetzt trinken"></span>`;
}

async function renderGrid(list){
  const grid=document.getElementById('wine-grid');
  if(!list||!list.length){
    grid.innerHTML=`<div class="empty"><i class="ti ti-wine"></i><div class="empty-title">Noch keine Weine</div><div class="empty-sub">Tippe auf „Eintragen" um deinen ersten Wein hinzuzufügen</div></div>`;
    return;
  }
  const items=await Promise.all(list.map(async w=>{
    let thumbHtml=`<div class="wine-row-thumb"><i class="ti ti-bottle wine-row-thumb-icon"></i></div>`;
    const photo=await dbGet('photos',w.id);
    if(photo)thumbHtml=`<div class="wine-row-thumb"><img src="${photo.data}" alt="Etikett" loading="lazy"></div>`;
    const weingut=w.weingut||w.name;
    const weinname=w.weinname||'';
    const meta=[w.vintage,w.region||w.country].filter(Boolean).join(' · ')||'—';
    const typeClass=w.type&&(w.type.includes('rot')||w.type.includes('Rot')||w.type.includes('Port'))?'type-badge-wine':'type-badge';
    return`<div class="wine-row" onclick="goDetail(${w.id})">
      ${thumbHtml}
      <div class="wine-row-body">
        <div class="wine-row-weingut">${weingut}</div>
        <div class="wine-row-name">${weinname||weingut}</div>
        <div class="wine-row-meta"><span>${meta}</span>${w.type?`<span class="${typeClass}">${w.type}</span>`:''}</div>
      </div>
      <div class="wine-row-right">
        <i class="ti ti-chevron-right" style="font-size:14px;color:var(--ink3)"></i>
      </div>
    </div>`;
  }));
  grid.innerHTML=items.join('');
}

const TYPE_CONFIG={
  'Schaumwein':{icon:'🥂',bg:'#e8f4f0',color:'#1a5c48'},
  'Weißwein':{icon:'🍋',bg:'#faf5e0',color:'#5c4a10'},
  'Rosé':{icon:'🌸',bg:'#fce8f0',color:'#8b1a4a'},
  'Orange':{icon:'🍊',bg:'#fdeede',color:'#7a3010'},
  'Rotwein':{icon:'🍷',bg:'#fbecea',color:'#8b1a2e'},
  'Portwein':{icon:'🫙',bg:'#f0e8f8',color:'#4a1a7a'},
  'Süßwein':{icon:'🍯',bg:'#fdf4dc',color:'#7a5010'},
  'Sonstiges':{icon:'🍾',bg:'#f0f0f0',color:'#4a4a4a'},
};
let activeTypeFilter=null;let activeCountryFilter=null;let activeWeingutFilter=null;

function renderStats(){
  const el=document.getElementById('stats-strip');if(!el)return;
  const countries=[...new Set(wines.map(w=>w.country).filter(Boolean))].length;
  const weinguts=[...new Set(wines.map(w=>w.weingut||w.name).filter(Boolean))].length;
  el.innerHTML=`
    <div class="stat-item"><span class="stat-num">${wines.length}</span><div class="stat-label">Weine</div></div>
    <div class="stat-item"><span class="stat-num">${countries}</span><div class="stat-label">Länder</div></div>
    <div class="stat-item"><span class="stat-num">${weinguts}</span><div class="stat-label">Weingüter</div></div>`;
}

function renderTypeTiles(){
  const el=document.getElementById('type-tiles');if(!el)return;
  const typeCounts={};wines.forEach(w=>{const t=w.type||'Sonstiges';typeCounts[t]=(typeCounts[t]||0)+1;});
  const types=['Schaumwein','Weißwein','Rosé','Orange','Rotwein','Portwein','Süßwein'];
  el.innerHTML=types.map(t=>{
    const cfg=TYPE_CONFIG[t]||{icon:'🍾',bg:'#f0f0f0',color:'#333'};
    const count=typeCounts[t]||0;
    const isActive=activeTypeFilter===t;
    return`<div class="type-tile" style="background:${cfg.bg};color:${cfg.color};border-color:${isActive?cfg.color:'transparent'}" onclick="filterByType('${t}')">
      <div class="type-tile-icon">${cfg.icon}</div>
      <div class="type-tile-label">${t}</div>
      <div class="type-tile-count">${count} Weine</div>
    </div>`;
  }).join('');
}

function renderCountryListHome(){
  const el=document.getElementById('country-list-home');if(!el)return;
  const countryGroups={};
  wines.forEach(w=>{
    const c=w.country||'—';
    if(!countryGroups[c])countryGroups[c]={wines:[],regions:new Set()};
    countryGroups[c].wines.push(w);
    if(w.region)countryGroups[c].regions.add(w.region);
  });
  if(!Object.keys(countryGroups).length){el.innerHTML=`<div style="font-size:11px;color:var(--ink3)">Noch keine Einträge</div>`;return;}
  el.innerHTML=Object.entries(countryGroups).sort(([a],[b])=>a.localeCompare(b)).map(([c,data])=>`
    <div class="home-list-item" onclick="filterByCountry('${c.replace(/'/g,"\\'")}')">
      <div><div class="home-list-name">${COUNTRY_FLAGS[c]||''} ${c}</div><div class="home-list-sub">${data.regions.size} Regionen</div></div>
      <div class="home-list-count">${data.wines.length}</div>
    </div>`).join('');
}

function renderWeingutListHome(){
  const el=document.getElementById('weingut-list-home');if(!el)return;
  const wgGroups={};
  wines.forEach(w=>{const wg=w.weingut||w.name;if(!wgGroups[wg])wgGroups[wg]=[];wgGroups[wg].push(w);});
  if(!Object.keys(wgGroups).length){el.innerHTML=`<div style="font-size:11px;color:var(--ink3)">Noch keine Einträge</div>`;return;}
  el.innerHTML=Object.entries(wgGroups).sort(([a],[b])=>a.localeCompare(b)).map(([wg,ws])=>`
    <div class="home-list-item" onclick="filterByWeingut('${wg.replace(/'/g,"\\'")}')">
      <div class="home-list-name" style="font-size:11px">${wg}</div>
      <div class="home-list-count">${ws.length}</div>
    </div>`).join('');
}

function filterByType(type){
  activeTypeFilter=activeTypeFilter===type?null:type;
  activeCountryFilter=null;activeWeingutFilter=null;
  renderTypeTiles();
  if(activeTypeFilter){
    document.getElementById('filter-label').textContent=(TYPE_CONFIG[type]?.icon||'')+' '+type;
    showFilteredList(wines.filter(w=>w.type===type));
  }
}

function filterByCountry(country){
  activeCountryFilter=country;activeTypeFilter=null;activeWeingutFilter=null;
  document.getElementById('filter-label').textContent=(COUNTRY_FLAGS[country]||'')+' '+country;
  showFilteredList(wines.filter(w=>(w.country||'—')===country));
}

function filterByWeingut(wg){
  activeWeingutFilter=wg;activeTypeFilter=null;activeCountryFilter=null;
  document.getElementById('filter-label').textContent='🏠 '+wg;
  showFilteredList(wines.filter(w=>(w.weingut||w.name)===wg));
}

function showFilteredList(list){switchMainTab('liste');renderGrid(list);}

function backToHome(){
  activeTypeFilter=null;activeCountryFilter=null;activeWeingutFilter=null;
  switchMainTab('home');
  renderTypeTiles();
}

function filterWines(){
  const q=(document.getElementById('sinput')?.value||'').toLowerCase();
  let base=wines;
  if(activeTypeFilter)base=base.filter(w=>w.type===activeTypeFilter);
  if(activeCountryFilter)base=base.filter(w=>(w.country||'—')===activeCountryFilter);
  if(activeWeingutFilter)base=base.filter(w=>(w.weingut||w.name)===activeWeingutFilter);
  if(q)base=base.filter(w=>[w.name,w.region,w.grape,w.notes,w.country,w.withwho,w.ort,w.lage,w.klass].join(' ').toLowerCase().includes(q));
  renderGrid(base);
}

function switchMainTab(t){
  activeMainTab=t;
  ['home','liste','karte','export'].forEach(x=>{
    const btn=document.getElementById('bnav-'+x);if(btn)btn.classList.toggle('active',x===t);
    const tab=document.getElementById('tab-'+x);if(tab)tab.style.display=x===t?'block':'none';
  });
  if(t==='karte')renderMapView(document.getElementById('karte-content'));
  if(t==='export')renderExportView(document.getElementById('export-content'));
  if(t==='liste'&&!activeTypeFilter&&!activeCountryFilter&&!activeWeingutFilter){
    document.getElementById('filter-label').textContent='Alle Weine';
    renderGrid(wines);
  }
}

function renderFilters(){}

function renderAll(){renderStats();renderTypeTiles();renderCountryListHome();renderWeingutListHome();}

  const ripeText=()=>{
    const f=parseInt(w.drinkFrom)||0,t=parseInt(w.drinkTo)||9999,n=2025;
    if(!w.drinkFrom&&!w.drinkTo)return'';

    const total=t-parseInt(w.drinkFrom||w.vintage||n);const elapsed=n-parseInt(w.drinkFrom||n);const pct=total>0?Math.min(100,Math.round(elapsed/total*100)):50;

  };
  document.getElementById('detail-content').innerHTML=`
    ${heroHtml}
    <div class="detail-body">
      ${w.country?`<div class="detail-eyebrow">${w.country}</div>`:''}

        ${w.vintage?`<span class="tag tag-v">${w.vintage}</span>`:''}
        ${w.klass?`<span class="tag tag-k">${w.klass}</span>`:''}
        ${w.soil?`<span class="tag tag-r"><i class="ti ti-shovel" style="font-size:9px;margin-right:2px"></i>${w.soil}</span>`:''}
      </div>
      <div class="detail-stars">${'★'.repeat(w.rating)}${'☆'.repeat(5-w.rating)}</div>
      <div class="divider"></div>

    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,

          {type:'text',text:`Du bist ein Weinexperte und analysierst ein Weinetikett-Foto für eine Weintagebuch-App. Lies alle sichtbaren Texte sorgfältig — Vorder- UND Rücketikett.

Antworte NUR mit einem JSON-Objekt, absolut kein Markdown:
{"weingut":"Nur der Produzent/Weingut (z.B. André Clouet, Giacomo Conterno, Dönnhoff)","weinname":"Nur der Weinname ohne Weingut (z.B. Grand Réserve, Monfortino, Idig)","vintage":"Jahrgang 4-stellig oder NV für Non-Vintage","type":"Exakt eines: Rotwein, Weißwein, Rosé, Orange, Schaumwein, Süßwein, Portwein, Sonstiges","grape":"Rebsorte(n) auf Deutsch kommagetrennt","alc":"Nur Zahl ohne % z.B. 13.5","country":"Land auf Deutsch","region":"Anbaugebiet z.B. Mosel, Champagne, Piemont","lage":"Spezifische Lage oder Appellation","klass":"Klassifikation z.B. Großes Gewächs, Grand Cru, Spätlese, DOCG","soil":"Bodenart nur wenn auf Etikett steht sonst leer","notes":"2-3 präzise Sätze zu Stil und typischen Aromen basierend auf deinem Weinwissen","confidence":"high wenn sehr sicher, medium wenn teils unsicher, low wenn schwer lesbar"}
Regeln: Alles auf Deutsch. Niemals raten — leere Strings für unlesbare Felder. Notes immer ausfüllen.`}
        ]}]})});

function loadD3AndDraw(){
  if(d3Loaded&&topoLoaded&&worldData){drawWorldMap();return;}
  // Load D3 and TopoJSON in parallel, then fetch world data
  const loadScript=(src)=>new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;
    s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
  const scripts=[];
  if(!d3Loaded)scripts.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js').then(()=>{d3Loaded=true;}));
  if(!topoLoaded)scripts.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js').then(()=>{topoLoaded=true;}));
  Promise.all(scripts).then(()=>{
    if(worldData){drawWorldMap();return;}
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r=>r.json()).then(data=>{worldData=data;drawWorldMap();})
      .catch(()=>{const l=document.getElementById('map-loading');if(l){l.innerHTML='<i class="ti ti-wifi-off" style="font-size:24px;opacity:.4;display:block;margin-bottom:8px"></i>Karte konnte nicht geladen werden.<br><small style="color:#9a9088">Internetverbindung prüfen</small>';}});
  }).catch(()=>{const l=document.getElementById('map-loading');if(l)l.textContent='Fehler beim Laden der Kartenbibliothek.';});
}

function getCountryWines(){const cw={};wines.forEach(w=>{const c=w.country||'Unbekannt';if(!cw[c])cw[c]=[];cw[c].push(w);});return cw;}

function drawWorldMap(){
  currentDrillCountry=null;
  const container=document.getElementById('map-svg-container');if(!container)return;
  const loading=document.getElementById('map-loading');if(loading)loading.style.display='none';
  // Wait a frame for layout on iPhone
  const W=container.getBoundingClientRect().width||container.offsetWidth||360;const H=280;
  if(W<10){setTimeout(drawWorldMap,100);return;}
  const countryWines=getCountryWines();
  const wineIsos=new Set(Object.keys(countryWines).map(n=>NAME_ISO[n]).filter(Boolean));
  container.innerHTML='';
  const svg=d3.select(container).append('svg').attr('width',W).attr('height',H).style('display','block');
  _mapSvg=svg;
  const projection=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  _mapProjection=projection;
  const path=d3.geoPath().projection(projection);
  _mapPath=path;
  const zoom=d3.zoom().scaleExtent([1,10]).on('zoom',e=>{
    g.attr('transform',e.transform);
    const k=e.transform.k;
    g.selectAll('circle.wine-marker').attr('r',3/k).attr('stroke-width',1/k);
  });
  _mapZoom=zoom;svg.call(zoom);
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#dae8f0');
  const g=svg.append('g');_mapG=g;
  const countries=topojson.feature(worldData,worldData.objects.countries);
  g.selectAll('path.country').data(countries.features).join('path').attr('class','country').attr('d',path)
    .attr('fill',d=>{const iso=String(d.id);return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'#8b1a2e':'#d8d0c5';})
    .attr('stroke','#fff').attr('stroke-width',0.4)
    .style('cursor',d=>{const iso=String(d.id);return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'pointer':'default';})
    .on('click',(event,d)=>{
      const iso=String(d.id);const name=ISO_NAMES[iso]||ISO_NAMES[iso.padStart(3,'0')];
      if(!name||!countryWines[name])return;
      if(REGION_GEODATA[name])drillToRegions(d,name,path,svg,g,zoom,W,H,countryWines);
      else zoomToCountry(d,name,path,svg,g,zoom,W,H,countryWines);
    });
  g.selectAll('circle.wine-marker').data(countries.features.filter(d=>{const iso=String(d.id);return wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0'));}))
    .join('circle').attr('class','wine-marker')
    .attr('cx',d=>{try{const c=path.centroid(d);return isNaN(c[0])?0:c[0];}catch(e){return 0;}})
    .attr('cy',d=>{try{const c=path.centroid(d);return isNaN(c[1])?0:c[1];}catch(e){return 0;}})
    .attr('r',3).attr('fill','#fff').attr('stroke','#8b1a2e').attr('stroke-width',1).style('pointer-events','none');
  document.getElementById('map-back-btn').style.display='none';
  document.getElementById('map-breadcrumb').style.display='none';
  renderCountryList(countryWines);
}

function drillToRegions(feature,countryName,path,svg,g,zoom,W,H,countryWines){
  currentDrillCountry=countryName;
  const [[x0,y0],[x1,y1]]=path.bounds(feature);if(isNaN(x0))return;
  const dx=x1-x0,dy=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  const scale=Math.min(8,0.78/Math.max(dx/W,dy/H));
  svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity.translate(W/2-scale*cx,H/2-scale*cy).scale(scale));
  const regionGeo=REGION_GEODATA[countryName];
  const countryWineList=countryWines[countryName]||[];
  const regionWines={};
  countryWineList.forEach(w=>{const r=w.region||'';if(!regionWines[r])regionWines[r]=[];regionWines[r].push(w);});
  const regionColors=['#8b1a2e','#b5472a','#5c6e2a','#2a5c6e','#6e2a5c','#2a6e5c','#6e5c2a','#2a3d6e'];
  const regionPath=d3.geoPath().projection(_mapProjection);
  setTimeout(()=>{
    g.selectAll('path.region').remove();g.selectAll('text.region-label').remove();
    g.selectAll('path.region').data(regionGeo.features).join('path').attr('class','region').attr('d',regionPath)
      .attr('fill',(d,i)=>{
        const rname=d.properties.name;
        const hasWine=Object.keys(regionWines).some(k=>k&&(k.toLowerCase().includes(rname.toLowerCase())||rname.toLowerCase().includes((k||'').toLowerCase())));
        return hasWine?regionColors[i%regionColors.length]+'cc':'rgba(180,170,160,0.25)';
      })
      .attr('stroke','#fff').attr('stroke-width',1.2/scale).style('cursor','pointer')
      .on('click',(event,d)=>{
        event.stopPropagation();
        try{
          const [[rx0,ry0],[rx1,ry1]]=regionPath.bounds(d);
          if(!isNaN(rx0)){const rdx=rx1-rx0,rdy=ry1-ry0,rcx=(rx0+rx1)/2,rcy=(ry0+ry1)/2;
            const rscale=Math.min(10,0.7/Math.max(rdx/W,rdy/H));
            svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(W/2-rscale*rcx,H/2-rscale*rcy).scale(rscale));}
        }catch(e){}
        scrollToRegion(countryName,d.properties.name);
      });
    g.selectAll('text.region-label').data(regionGeo.features).join('text').attr('class','region-label')
      .attr('x',d=>{try{const c=regionPath.centroid(d);return isNaN(c[0])?0:c[0];}catch(e){return 0;}})
      .attr('y',d=>{try{const c=regionPath.centroid(d);return isNaN(c[1])?0:c[1];}catch(e){return 0;}})
      .attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-size',9/scale).attr('font-family','DM Sans, sans-serif').attr('font-weight','700')
      .attr('fill','#fff').attr('stroke','rgba(0,0,0,0.4)').attr('stroke-width',0.3/scale)
      .attr('paint-order','stroke').attr('pointer-events','none').text(d=>d.properties.name);
  },400);
  document.getElementById('map-back-btn').style.display='block';
  const bc=document.getElementById('map-breadcrumb');
  bc.textContent=`${COUNTRY_FLAGS[countryName]||''} ${countryName} — Gebiet antippen`;bc.style.display='block';
  setTimeout(()=>{
    document.querySelectorAll('.map-country-card').forEach(card=>{
      if(card.dataset.country===countryName){card.querySelector('.map-country-wines').classList.add('open');card.scrollIntoView({behavior:'smooth',block:'start'});}
    });
  },600);
}

function zoomToCountry(feature,countryName,path,svg,g,zoom,W,H,countryWines){
  try{
    const [[x0,y0],[x1,y1]]=path.bounds(feature);if(isNaN(x0))return;
    const dx=x1-x0,dy=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
    const scale=Math.min(8,0.8/Math.max(dx/W,dy/H));
    svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2-scale*cx,H/2-scale*cy).scale(scale));

function scrollToRegion(countryName,regionName){

async function importJson(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)&&d.length>0){
        if(confirm(`${d.length} Weine importieren?`)){
          for(const w of d)await dbPut('wines',w);
          wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
          goList();alert('Import erfolgreich!');
        }
      }
    }catch{alert('Ungültige Datei');}
  };
  r.readAsText(file);
}

// ── Autocomplete ──────────────────────────────────────────
const AC_FIELDS={
  grape:w=>w.grape,region:w=>w.region,country:w=>w.country,
  lage:w=>w.lage,klass:w=>w.klass,soil:w=>w.soil
};

function acGetSuggestions(field,query){
  const getter=AC_FIELDS[field];if(!getter)return[];
  const q=query.toLowerCase().trim();
  const all=[...new Set(wines.map(getter).filter(Boolean))].sort();
  if(!q)return all.slice(0,6);
  return all.filter(v=>v.toLowerCase().includes(q)).slice(0,8);
}

function acHighlight(text,query){
  if(!query)return text;
  const idx=text.toLowerCase().indexOf(query.toLowerCase());
  if(idx<0)return text;
  return text.slice(0,idx)+`<strong>${text.slice(idx,idx+query.length)}</strong>`+text.slice(idx+query.length);
}

function acShow(input,field){
  const q=input.value;
  const suggestions=acGetSuggestions(field,q);
  const dd=document.getElementById('ac-'+field);if(!dd)return;
  if(!suggestions.length){dd.classList.remove('show');return;}
  dd.innerHTML=suggestions.map(s=>`<div class="ac-item" onmousedown="acSelect('${field}','${s.replace(/'/g,"\\'")}');return false">${acHighlight(s,q)}</div>`).join('');
  dd.classList.add('show');
}

function acHide(field){
  setTimeout(()=>{const dd=document.getElementById('ac-'+field);if(dd)dd.classList.remove('show');},150);
}

function acSelect(field,value){
  const input=document.getElementById('f-'+field);if(input)input.value=value;
  const dd=document.getElementById('ac-'+field);if(dd)dd.classList.remove('show');
}

// ── Google Drive Sync ──────────────────────────────────────────────
const GAPI_CLIENT_ID='399210738927-kr0dkpovdkrr8ugiqv7vcr43oggagjj2.apps.googleusercontent.com';
const GAPI_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME='weinbuch-data.json';
let gapiReady=false;let gisReady=false;let tokenClient=null;let driveFileId=null;

function loadGoogleLibs(){
  const s1=document.createElement('script');s1.src='https://apis.google.com/js/api.js';
  s1.onload=()=>{gapi.load('client',async()=>{await gapi.client.init({});gapiReady=true;checkSyncReady();});};
  document.head.appendChild(s1);
  const s2=document.createElement('script');s2.src='https://accounts.google.com/gsi/client';
  s2.onload=()=>{tokenClient=google.accounts.oauth2.initTokenClient({client_id:GAPI_CLIENT_ID,scope:GAPI_SCOPE,callback:onTokenResponse});gisReady=true;checkSyncReady();};
  document.head.appendChild(s2);
}

function checkSyncReady(){
  if(gapiReady&&gisReady){
    updateSyncUI('bereit');
    const saved=localStorage.getItem('wt_gdrive_token');
    if(saved){gapi.client.setToken(JSON.parse(saved));updateSyncUI('verbunden');syncFromDrive();}
  }
}

function onTokenResponse(resp){
  if(resp.error){updateSyncUI('fehler');return;}
  localStorage.setItem('wt_gdrive_token',JSON.stringify(gapi.client.getToken()));
  updateSyncUI('verbunden');
  syncFromDrive();
}

function connectDrive(){
  if(!gapiReady||!gisReady){alert('Google lädt noch, kurz warten.');return;}
  tokenClient.requestAccessToken({prompt:'consent'});
}

function disconnectDrive(){
  const token=gapi.client.getToken();
  if(token){google.accounts.oauth2.revoke(token.access_token,()=>{});}
  gapi.client.setToken(null);
  localStorage.removeItem('wt_gdrive_token');
  driveFileId=null;
  updateSyncUI('bereit');
}

async function syncToDrive(){
  if(!gapi.client.getToken()){return;}
  updateSyncUI('sync');
  try{
    const data=JSON.stringify(wines);
    const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder']};
    if(!driveFileId)await findDriveFile();
    if(driveFileId){
      await gapi.client.request({path:`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}`,method:'PATCH',params:{uploadType:'media'},body:data,headers:{'Content-Type':'application/json'}});
    } else {
      const boundary='weinbuch_boundary';
      const body=`--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${boundary}--`;
      const resp=await gapi.client.request({path:'https://www.googleapis.com/upload/drive/v3/files',method:'POST',params:{uploadType:'multipart'},body,headers:{'Content-Type':`multipart/related; boundary=${boundary}`}});
      driveFileId=resp.result.id;
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('fehler');
  }
}

async function syncFromDrive(){
  if(!gapi.client.getToken())return;
  updateSyncUI('sync');
  try{
    await findDriveFile();
    if(!driveFileId){updateSyncUI('verbunden');return;}
    const resp=await gapi.client.request({path:`https://www.googleapis.com/drive/v3/files/${driveFileId}`,params:{alt:'media'}});
    const driveWines=typeof resp.result==='string'?JSON.parse(resp.result):resp.result;
    if(Array.isArray(driveWines)&&driveWines.length>0){
      const localIds=new Set(wines.map(w=>w.id));
      const toAdd=driveWines.filter(w=>!localIds.has(w.id));
      for(const w of toAdd)await dbPut('wines',w);
      if(toAdd.length>0){
        wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
        renderAll();
      }
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('verbunden');
  }
}

async function findDriveFile(){
  const resp=await gapi.client.request({path:'https://www.googleapis.com/drive/v3/files',params:{spaces:'appDataFolder',q:`name='${DRIVE_FILE_NAME}'`,fields:'files(id,name)'}});
  const files=resp.result.files||[];
  driveFileId=files.length>0?files[0].id:null;
}

function updateSyncUI(state){
  const btn=document.getElementById('sync-btn');
  const dot=document.getElementById('sync-dot');
  if(!btn||!dot)return;
  const states={
    bereit:{dot:'#b8860b',label:'Drive verbinden',disabled:false},
    verbunden:{dot:'#2d5a27',label:'Drive verbunden',disabled:false},
    sync:{dot:'#185fa5',label:'Synchronisiert…',disabled:true},
    ok:{dot:'#2d5a27',label:'Gespeichert ✓',disabled:false},
    fehler:{dot:'#a32d2d',label:'Fehler',disabled:false},
  };
  const s=states[state]||states.bereit;
  dot.style.background=s.dot;
  btn.textContent=s.label;
  btn.disabled=s.disabled;
  if(state==='ok')setTimeout(()=>updateSyncUI('verbunden'),2500);
}
