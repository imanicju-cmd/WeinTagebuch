<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weintagebuch">
<meta name="theme-color" content="#1C1018">
<title>Weintagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet"><style>
:root {
  --bg: #1C1018;
  --bg2: #241420;
  --bg3: #2E1A2A;
  --ink: #F5F2EC;
  --ink2: #C8C0B0;
  --ink3: #6A6458;
  --wine: #E9F056;
  --wine2: #D4DC30;
  --wine-pale: #1A1A08;
  --accent-r: #F75C54;
  --accent-b: #D7EFFF;
  --accent-g: #AEB8A0;
  --accent-s: #C4A882;
  --accent-p: #F7A07A;
  --accent-k: #351E28;
  --border: rgba(245,242,236,0.07);
  --border2: rgba(245,242,236,0.14);
  --r: 12px;
  --r2: 18px;
  --r3: 26px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Outfit', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--ink)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
html,body{width:100%;overflow-x:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg);border-bottom:0.5px solid var(--border);flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
.topbar-title{font-size:14px;font-weight:500;flex:1;color:var(--ink);letter-spacing:.2px}
.topbar-logo{font-size:22px;font-weight:800;flex:1;color:var(--ink);letter-spacing:-1.5px;text-transform:lowercase;font-family:var(--font-body)}
.topbar-logo span{color:var(--wine)}

/* BUTTONS */
.btn{font-family:var(--font-body);background:transparent;border:1px solid var(--border2);border-radius:6px;padding:8px 16px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px;transition:all .12s;letter-spacing:.8px;text-transform:uppercase}
.btn:active{opacity:.7;transform:scale(0.97)}
.btn-wine{background:var(--wine);color:#0D0D0D;border-color:var(--wine);font-weight:700}
.btn-wine:active{background:var(--wine2)}
.btn-dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-icon{padding:8px;border-radius:6px}
.btn-ghost{border-color:transparent}
.btn-sm{font-size:9px;padding:5px 10px;letter-spacing:.6px}

/* SCROLL */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-body::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:#160E14;flex-shrink:0;padding:8px 8px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:0.5px solid var(--border)}
.bnav-btn{flex:1;padding:10px 4px 6px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;font-weight:600;color:var(--ink3);letter-spacing:.8px;text-transform:uppercase;font-family:var(--font-body);border-radius:8px;transition:all .15s}
.bnav-btn.active{color:var(--wine);background:rgba(233,240,86,0.08)}
.bnav-btn i{font-size:20px}

/* HOME TABS */
.home-tab-btn{flex:1;padding:14px 4px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--ink3);font-family:var(--font-body);border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-tab-btn.active{color:var(--wine);border-bottom-color:var(--wine)}

/* STATS */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px;flex-shrink:0}
.stat-item{background:var(--bg2);border-radius:var(--r);padding:14px 10px;text-align:center;border:0.5px solid var(--border)}
.stat-item:first-child{background:var(--wine);border-color:var(--wine)}
.stat-num{font-size:30px;font-weight:800;color:var(--ink);display:block;line-height:1;letter-spacing:-2px}
.stat-item:first-child .stat-num{color:#0D0D0D}
.stat-label{font-size:8px;color:var(--ink3);margin-top:5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.stat-item:first-child .stat-label{color:rgba(13,13,13,0.6)}

/* TYPE TILES */
.type-tile{border-radius:var(--r2);cursor:pointer;transition:all .15s;border:none;overflow:hidden;aspect-ratio:1;position:relative;display:flex;align-items:flex-end}
.type-tile:active{transform:scale(0.94)}
.type-tile-gradient{position:absolute;inset:0;border-radius:var(--r2)}
.type-tile-body{position:relative;padding:0;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.type-tile-label{font-size:15px;font-weight:800;color:#fff;letter-spacing:4px;line-height:1;font-family:var(--font-body);text-shadow:0 1px 12px rgba(0,0,0,.5);text-align:center}
.type-tile-count{font-size:9px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.5px}
.type-tile.active::after{content:'';position:absolute;inset:0;border-radius:var(--r2);border:2.5px solid rgba(255,255,255,.85)}

/* COUNTRY TILES */
.country-tile{border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;background:var(--bg2);margin-bottom:8px;border:0.5px solid var(--border)}
.country-tile:active{opacity:.7}
.country-tile.active{border-color:var(--wine)}
.country-flag{font-size:28px}
.country-tile-name{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.3px;flex:1}
.country-tile-meta{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.country-tile-count{font-size:22px;font-weight:800;color:var(--wine);min-width:28px;text-align:right;letter-spacing:-1px}

/* WEINGUT / ALPHA */
.alpha-section{margin-bottom:4px}
.alpha-letter{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;padding:14px 2px 6px}
.weingut-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer;transition:opacity .12s}
.weingut-row:active{opacity:.6}
.weingut-row-name{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:-.1px}
.weingut-row-count{font-size:12px;font-weight:700;color:var(--wine)}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink3)}
.search-input{width:100%;font-family:var(--font-body);font-size:13px;padding:11px 14px 11px 38px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--ink);font-weight:400}
.search-input:focus{outline:none;border-color:var(--wine)}
.search-input::placeholder{color:var(--ink3)}

/* WINE LIST */
.wine-list{display:flex;flex-direction:column;padding:4px 0}
.wine-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .1s}
.wine-row:active{background:var(--bg2)}
.wine-row-thumb{width:44px;height:56px;border-radius:8px;background:var(--bg2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--border)}
.wine-row-thumb img{width:100%;height:100%;object-fit:cover}
.wine-row-thumb-icon{font-size:20px;color:var(--ink3)}
.wine-row-body{flex:1;min-width:0}
.wine-row-weingut{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px;font-weight:600}
.wine-row-name{font-size:16px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.wine-row-meta{font-size:10px;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wine-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.type-badge{font-size:9px;padding:3px 8px;border-radius:4px;border:0.5px solid var(--border2);color:var(--ink3);white-space:nowrap;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.type-badge-wine{background:var(--wine-pale);color:var(--wine);border-color:transparent}
.ripeness-dot{width:5px;height:5px;border-radius:50%;display:inline-block;vertical-align:middle}
.rd-now{background:#3a7a28}.rd-soon{background:#c08010}.rd-wait{background:#2060a0}.rd-over{background:#a02020}

/* DETAIL */
.detail-hero{width:100%;height:260px;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero-icon{font-size:72px;color:var(--ink3);opacity:.1}
.detail-body{padding:24px 20px 56px}
.detail-eyebrow{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:600}
.detail-name{font-size:36px;font-weight:800;color:var(--ink);line-height:.95;margin-bottom:6px;letter-spacing:-2px}
.detail-subname{font-family:var(--font-display);font-size:22px;color:var(--ink2);font-style:italic;margin-bottom:10px;font-weight:400}
.detail-origin{font-size:12px;color:var(--ink3);margin-bottom:18px;letter-spacing:.3px}
.divider{height:0.5px;background:var(--border);margin:20px 0}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-size:9px;padding:4px 10px;border-radius:4px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.tag-r{background:var(--bg2);color:var(--ink2);border:0.5px solid var(--border2)}
.tag-v{background:var(--wine);color:#0D0D0D}
.tag-g{background:rgba(233,240,86,.15);color:var(--wine);border:0.5px solid rgba(233,240,86,.3)}
.tag-t{background:var(--wine-pale);color:var(--wine)}
.tag-k{background:rgba(174,184,160,.15);color:var(--accent-g)}
.detail-stars{font-size:22px;color:var(--wine);letter-spacing:4px;margin-bottom:18px}
.section-label{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;margin-top:22px}
.section-text{font-size:14px;color:var(--ink2);line-height:1.8}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.detail-stat{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center;border:0.5px solid var(--border)}
.detail-stat-n{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-1px}
.detail-stat-l{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;margin-top:4px;font-weight:600}
.experience-box{background:var(--bg2);border-radius:var(--r2);padding:16px;margin-top:8px;border:0.5px solid var(--border)}
.exp-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:6px 0;border-bottom:0.5px solid var(--border)}
.exp-row:last-child{border-bottom:none}
.exp-row i{font-size:15px;color:var(--ink3);flex-shrink:0;width:18px}
.ripe-bar{height:3px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:10px}
.ripe-fill{height:100%;border-radius:3px;transition:width .3s}

/* ADD FORM */
.add-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.add-scroll::-webkit-scrollbar{display:none}
.form-section{padding:20px 20px;border-bottom:0.5px solid var(--border)}
.form-section-title{font-size:9px;font-weight:700;color:var(--ink3);margin-bottom:16px;letter-spacing:2px;text-transform:uppercase}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{margin-bottom:10px}
.form-label{font-size:9px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;display:block}
.form-input,.finput{font-family:var(--font-body);font-size:14px;padding:11px 14px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--ink);width:100%;transition:border-color .15s;font-weight:400}
.form-input:focus,.finput:focus{outline:none;border-color:var(--wine)}
.form-textarea{resize:none;min-height:80px;font-family:var(--font-body);font-size:13px;line-height:1.7}

/* PHOTO */
.photo-zone{border:1px dashed var(--border2);border-radius:var(--r2);padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2)}
.photo-zone:active{border-color:var(--wine)}
.photo-zone-icon{font-size:28px;color:var(--ink3);display:block;margin-bottom:8px}
.photo-zone-text{font-size:12px;color:var(--ink2);font-weight:500}
.photo-zone-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--wine);border:1px solid var(--wine);border-radius:4px;padding:3px 12px;margin-top:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--r);display:none;margin-top:10px}

/* AI */
.ai-loading{display:none;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-radius:var(--r);font-size:11px;color:var(--ink2);font-weight:500;border:0.5px solid var(--border)}
.ai-loading.show{display:flex}
.ai-result{background:var(--bg2);border-radius:var(--r);padding:12px;display:none;margin-top:8px;border:0.5px solid var(--border)}
.ai-result.show{display:block}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ai-field{background:var(--bg);border-radius:8px;border:0.5px solid var(--border);padding:8px 10px}
.ai-field-l{font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.ai-field-v{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
.dots span{animation:blink 1.2s infinite;opacity:0}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* STARS */
.star-row{display:flex;gap:6px}
.star-btn{background:none;border:none;font-size:28px;cursor:pointer;padding:2px;color:var(--border2);transition:color .1s}
.star-btn.lit{color:var(--wine)}

/* MAP */
.map-wrap{height:100%;display:flex;flex-direction:column}
.map-country-card{background:var(--bg);border-bottom:0.5px solid var(--border);overflow:hidden}
.map-country-header{display:flex;align-items:center;gap:10px;padding:14px 20px;cursor:pointer}
.map-country-flag{font-size:20px}
.map-country-name{font-size:15px;font-weight:600;flex:1;color:var(--ink);letter-spacing:-.2px}
.map-country-count{font-size:10px;color:var(--ink3);font-weight:600;letter-spacing:.4px}
.map-country-wines{display:none;padding:0 0 8px}
.map-country-wines.open{display:block}
.map-region-item{border-top:0.5px solid var(--border);padding:10px 20px 4px}
.map-region-name{font-size:9px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}

/* FILTERS */
.filter-row{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;flex-shrink:0}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{font-family:var(--font-body);font-size:10px;padding:6px 14px;border-radius:4px;border:0.5px solid var(--border2);background:transparent;color:var(--ink3);cursor:pointer;white-space:nowrap;font-weight:600;transition:all .12s;letter-spacing:.6px;text-transform:uppercase}
.filter-chip.active,.filter-chip:active{background:var(--wine);color:#0D0D0D;border-color:var(--wine)}
select.filter-chip{-webkit-appearance:none;appearance:none}

/* REBSORTEN */
.rebsorten-tag{font-size:10px;padding:4px 10px;border-radius:4px;background:var(--bg2);border:0.5px solid var(--border2);color:var(--ink2);display:inline-block;margin:3px;font-weight:500}

/* EXPORT */
.export-card{background:var(--bg2);border-radius:var(--r2);padding:18px;margin:10px 16px;cursor:pointer;transition:all .12s;border:0.5px solid var(--border)}
.export-card:active{opacity:.7}
.export-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;letter-spacing:-.2px}
.export-desc{font-size:11px;color:var(--ink3)}

/* MAP REGION DETAIL */
.map-svg-container{background:#120B10}
</style>>
</head>
<body>
<div id="app">

<!-- LIST SCREEN -->
<div id="screen-list" class="screen active">
  <div class="topbar">
    <div class="topbar-logo" onclick="showApiKeySettingsMenu()" style="cursor:pointer">wein<span>buch</span></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="display:flex;align-items:center;gap:5px;cursor:pointer" onclick="gapi&&gapi.client&&gapi.client.getToken()?disconnectDrive():connectDrive()" title="Google Drive Sync">
        <span id="sync-dot" style="width:7px;height:7px;border-radius:50%;background:#d0c8bc;flex-shrink:0;transition:background .3s"></span>
        <span id="sync-btn" style="font-size:10px;color:var(--ink3);font-family:var(--font-body)">Drive</span>
      </div>
      <button class="btn btn-wine" onclick="goAdd()"><i class="ti ti-plus"></i> Eintragen</button>
    </div>
  </div>

  <!-- HOME SUB-NAV -->
  <div id="home-subnav" style="display:flex;border-bottom:0.5px solid var(--border);background:var(--bg);flex-shrink:0;overflow-x:auto">
    <button class="home-tab-btn active" id="htab-weinart" onclick="if(typeof switchHomeTab==='function')switchHomeTab('weinart')">Weinart</button>
    <button class="home-tab-btn" id="htab-laender" onclick="if(typeof switchHomeTab==='function')switchHomeTab('laender')">Länder</button>
    <button class="home-tab-btn" id="htab-weingueter" onclick="if(typeof switchHomeTab==='function')switchHomeTab('weingueter')">Weingüter</button>
    <button class="home-tab-btn" id="htab-rebsorten" onclick="if(typeof switchHomeTab==='function')switchHomeTab('rebsorten')">Rebsorten</button>
  </div>

  <!-- WEINART PANEL -->
  <div id="panel-weinart" class="scroll-body">
    <div id="stats-strip" class="stats-strip"></div>
    <div style="padding:16px 14px">
      <div id="type-tiles" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    </div>
  </div>

  <!-- LÄNDER PANEL -->
  <div id="panel-laender" class="scroll-body" style="display:none">
    <div style="padding:16px 14px">
      <div id="country-tiles"></div>
    </div>
  </div>

  <!-- WEINGÜTER PANEL -->
  <div id="panel-weingueter" class="scroll-body" style="display:none">
    <div style="padding:16px 14px">
      <div id="weingut-alpha-list"></div>
    </div>
  </div>

  <!-- REBSORTEN PANEL -->
  <div id="panel-rebsorten" class="scroll-body" style="display:none">
    <div style="padding:12px 14px 6px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:10px;color:var(--ink3);font-weight:500" id="rebsorten-count"></div>
      <button class="btn" style="font-size:10px;padding:5px 12px" onclick="showAddRebsorte()"><i class="ti ti-plus" style="font-size:12px"></i> Neue Rebsorte</button>
    </div>
    <div id="rebsorten-alpha-list" style="padding:0 14px 20px"></div>
  </div>

  <!-- LISTE TAB (filtered results) -->
  <div id="tab-liste" class="scroll-body" style="display:none">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0">
      <button class="btn btn-ghost btn-icon" onclick="backToHome()" style="padding:6px"><i class="ti ti-arrow-left" style="font-size:16px"></i></button>
      <div id="filter-label" style="font-size:14px;font-weight:700;color:var(--ink);flex:1;letter-spacing:-0.3px"></div>
      <div class="search-wrap" style="width:130px">
        <i class="ti ti-search"></i>
        <input class="search-input" id="sinput" placeholder="Suchen…" oninput="filterWines()" style="font-size:12px;padding:7px 10px 7px 30px">
      </div>
    </div>
    <div id="wine-grid" class="wine-list"></div>
  </div>

  <!-- KARTE TAB -->
  <div id="tab-karte" class="scroll-body" style="display:none"><div id="karte-content" class="map-wrap"></div></div>

  <!-- EXPORT TAB -->
  <div id="tab-export" class="scroll-body" style="display:none"><div id="export-content"></div></div>

// IndexedDB setup
let db;
const DB_NAME='weinbuch';const DB_VER=1;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('wines'))d.createObjectStore('wines',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=()=>rej(req.error);
  });
}
function dbGet(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).put(val);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function dbDelete(store,id){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const req=tx.objectStore(store).delete(id);req.onsuccess=()=>res();req.onerror=()=>rej(req.error)})}

async function init(){
  await openDB();
  const stored=await dbGetAll('wines');
  if(stored.length>0){wines=stored.sort((a,b)=>b.id-a.id);}
  else{wines=[...DEMO];for(const w of DEMO)await dbPut('wines',w);}
  renderAll();
}

function ripeDot(w){
  const f=parseInt(w.drinkFrom)||0,t=parseInt(w.drinkTo)||9999,n=2025;
  if(!w.drinkFrom&&!w.drinkTo)return'';
  if(n<f)return`<span class="ripeness-dot rd-wait" title="Noch warten"></span>`;
  if(n>t)return`<span class="ripeness-dot rd-over" title="Überlagert"></span>`;
  if(t-n<=2)return`<span class="ripeness-dot rd-soon" title="Bald trinken"></span>`;
  return`<span class="ripeness-dot rd-now" title="Jetzt trinken"></span>`;
}

async function renderGrid(list){
  const grid=document.getElementById('wine-grid');
  if(!list||!list.length){
    grid.innerHTML=`<div class="empty"><i class="ti ti-wine"></i><div class="empty-title">Noch keine Weine</div><div class="empty-sub">Tippe auf „Eintragen" um deinen ersten Wein hinzuzufügen</div></div>`;
    return;
  }
  const items=await Promise.all(list.map(async w=>{
    let thumbHtml=`<div class="wine-row-thumb"><i class="ti ti-bottle wine-row-thumb-icon"></i></div>`;
    const photo=await dbGet('photos',w.id);
    if(photo)thumbHtml=`<div class="wine-row-thumb"><img src="${photo.data}" alt="Etikett" loading="lazy"></div>`;
    const weingut=w.weingut||w.name;
    const weinname=w.weinname||'';
    const meta=[w.vintage,w.region||w.country].filter(Boolean).join(' · ')||'—';
    const typeClass=w.type&&(w.type.includes('rot')||w.type.includes('Rot')||w.type.includes('Port'))?'type-badge-wine':'type-badge';
    return`<div class="wine-row" onclick="goDetail(${w.id})">
      ${thumbHtml}
      <div class="wine-row-body">
        <div class="wine-row-weingut">${weingut}</div>
        <div class="wine-row-name">${weinname||weingut}</div>
        <div class="wine-row-meta"><span>${meta}</span>${w.type?`<span class="${typeClass}">${w.type}</span>`:''}</div>
      </div>
      <div class="wine-row-right">
        <i class="ti ti-chevron-right" style="font-size:14px;color:var(--ink3)"></i>
      </div>
    </div>`;
  }));
  grid.innerHTML=items.join('');
}

async function analyzeUrl(){
  const url=document.getElementById('f-url').value.trim();
  if(!url){alert('Bitte zuerst einen Link eingeben.');return;}
  const apiKey=checkApiKey();if(!apiKey)return;
  document.getElementById('ai-loading').classList.add('show');
  document.getElementById('ai-result').classList.remove('show');
  try{
    const txt=await callClaudeAPI([{role:'user',content:[{type:'text',text:`Analysiere diese Weinprodukt-URL und extrahiere alle Weindaten. URL: ${url}\n\nExtrahiere: Weingut, Weinname, Jahrgang, Weinart, Rebsorte, Alkohol, Land, Anbaugebiet, Lage, Klassifikation, Beschreibung.\n\nAntworte NUR mit diesem JSON (kein Markdown, keine Erklärung):\n{"weingut":"","weinname":"","vintage":"","type":"Rotwein|Weißwein|Rosé|Schaumwein|Süßwein|Portwein|Sonstiges","grape":"","alc":"","country":"auf Deutsch","region":"","lage":"","klass":"","soil":"","notes":"2-3 Sätze auf Deutsch","confidence":"high|medium|low"}\n\nFalls URL nicht direkt lesbar, extrahiere Infos aus dem URL-Text (Produktname, Weingut etc. stehen oft darin).`}]}]);
    aiData=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(aiData.weingut&&!aiData.name)aiData.name=aiData.weingut+(aiData.weinname?' '+aiData.weinname:'');
    const linkEl=document.getElementById('f-link');if(linkEl&&!linkEl.value)linkEl.value=url;
    const conf=aiData.confidence||'medium';
    const confColor=conf==='high'?'#AEB8A0':conf==='medium'?'#E9F056':'#F75C54';
    const confLabel=conf==='high'?'✓ Erkannt':conf==='medium'?'⚠ Bitte prüfen':'✗ URL nicht lesbar';
    const fields=[['weingut','Weingut'],['weinname','Weinname'],['vintage','Jahrgang'],['country','Land'],['region','Anbaugebiet'],['lage','Lage'],['type','Art'],['grape','Rebsorte'],['alc','Alkohol'],['klass','Klassifikation']];
    document.getElementById('ai-grid').innerHTML=`<div style="grid-column:1/-1;font-size:10px;font-weight:700;color:${confColor};padding:2px 0 6px;letter-spacing:.4px">${confLabel}</div>`+fields.filter(([k])=>aiData[k]).map(([k,l])=>`<div class="ai-field"><div class="ai-field-l">${l}</div><div class="ai-field-v">${aiData[k]}</div></div>`).join('');
    document.getElementById('ai-result').classList.add('show');
  }catch(err){
    console.error('analyzeUrl:',err);
    document.getElementById('ai-result').innerHTML=`<div style="font-size:11px;color:#F75C54;line-height:1.7">Fehler: ${err.message||'Unbekannt'}<br><span style="color:var(--ink3);font-size:10px">API Key prüfen: Logo antippen → Einstellungen</span></div>`;
    document.getElementById('ai-result').classList.add('show');
  }
  document.getElementById('ai-loading').classList.remove('show');
}


async function callClaudeAPI(messages, maxTokens=800){
  const apiKey=getApiKey();
  if(!apiKey)throw new Error('Kein API Key gesetzt');
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,messages})
  });
  if(!resp.ok){
    const errData=await resp.json().catch(()=>({}));
    throw new Error(errData.error?.message||`HTTP ${resp.status}`);
  }
  const d=await resp.json();
  return d.content?.filter(b=>b.type==='text').map(b=>b.text).join('')||'';
}

function renderTypeTiles(){
  const el=document.getElementById('type-tiles');if(!el)return;
  const typeCounts={};
  wines.forEach(w=>{
    const t=w.type||'Sonstiges';
    // Group Portwein + Süßwein together
    const bucket=t==='Portwein'?'Süßwein':t;
    typeCounts[bucket]=(typeCounts[bucket]||0)+1;
  });
  const types=['Schaumwein','Weißwein','Rosé','Orange','Rotwein','Süßwein'];
  el.innerHTML=types.map(t=>{
    const cfg=TYPE_GRADIENTS[t]||TYPE_GRADIENTS['Sonstiges'];
    const count=typeCounts[t]||0;
    const isActive=activeTypeFilter===t;
    return`<div class="type-tile${isActive?' active':''}" onclick="filterByType('${t}')">
      <div class="type-tile-gradient" style="background:${cfg.grad}"></div>
      <div class="type-tile-body">
        <div class="type-tile-label">${cfg.label}</div>
        <div class="type-tile-count">${count}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCountryTiles(){
  const el=document.getElementById('country-tiles');if(!el)return;
  const countryGroups={};
  wines.forEach(w=>{
    const c=w.country||'—';
    if(!countryGroups[c])countryGroups[c]={wines:[],regions:new Set()};
    countryGroups[c].wines.push(w);
    if(w.region)countryGroups[c].regions.add(w.region);
  });
  if(!Object.keys(countryGroups).length){el.innerHTML=`<div style="font-size:13px;color:var(--ink3);text-align:center;padding:32px">Noch keine Einträge</div>`;return;}
  el.innerHTML=Object.entries(countryGroups).sort(([a],[b])=>a.localeCompare(b)).map(([c,data])=>`
    <div class="country-tile" onclick="filterByCountry('${c.replace(/'/g,"\\'")}')">
      <div class="country-flag">${COUNTRY_FLAGS[c]||'🍷'}</div>
      <div style="flex:1">
        <div class="country-tile-name">${c}</div>
        <div class="country-tile-meta">${data.regions.size} ${data.regions.size===1?'Region':'Regionen'}</div>
      </div>
      <div class="country-tile-count">${data.wines.length}</div>
    </div>`).join('');
}

function renderWeingutAlpha(){
  const el=document.getElementById('weingut-alpha-list');if(!el)return;
  const wgGroups={};
  wines.forEach(w=>{const wg=w.weingut||w.name;if(!wgGroups[wg])wgGroups[wg]=0;wgGroups[wg]++;});
  const sorted=Object.entries(wgGroups).sort(([a],[b])=>a.localeCompare(b,'de'));
  const byLetter={};
  sorted.forEach(([wg,count])=>{const letter=wg[0].toUpperCase();if(!byLetter[letter])byLetter[letter]=[];byLetter[letter].push([wg,count]);});
  if(!Object.keys(byLetter).length){el.innerHTML=`<div style="font-size:13px;color:var(--ink3);text-align:center;padding:32px">Noch keine Einträge</div>`;return;}
  el.innerHTML=Object.entries(byLetter).map(([letter,items])=>`
    <div class="alpha-section">
      <div class="alpha-letter">${letter}</div>
      ${items.map(([wg,count])=>`
        <div class="weingut-row" onclick="filterByWeingut('${wg.replace(/'/g,"\\'")}')">
          <div class="weingut-row-name">${wg}</div>
          <div class="weingut-row-count">${count}</div>
        </div>`).join('')}
    </div>`).join('');
}

      document.getElementById('ai-result').classList.add('show');
    }
    document.getElementById('ai-loading').classList.remove('show');
  };
  reader.readAsDataURL(file);
}

function applyAi(){
  if(!aiData)return;
  if(aiData.weingut){document.getElementById('f-weingut').value=aiData.weingut;}
  else if(aiData.name){const parts=aiData.name.split(' ');document.getElementById('f-weingut').value=parts[0]||aiData.name;}
  if(aiData.weinname){document.getElementById('f-name').value=aiData.weinname;}
  const m={'grape':'f-grape','alc':'f-alc','country':'f-country','region':'f-region','lage':'f-lage','klass':'f-klass','soil':'f-soil','notes':'f-notes'};
  Object.entries(m).forEach(([k,id])=>{if(aiData[k]){const e=document.getElementById(id);if(e)e.value=aiData[k];}});
  if(aiData.vintage)document.getElementById('f-vintage').value=aiData.vintage;
  if(aiData.type){const sel=document.getElementById('f-type');[...sel.options].forEach(o=>{if(o.value===aiData.type)sel.value=aiData.type;});}
}

async function saveWine(){
  const weingut=document.getElementById('f-weingut').value.trim();
  const weinname=document.getElementById('f-name').value.trim();
  if(!weingut&&!weinname){
    // Highlight both fields instead of alert
    ['f-weingut','f-name'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.style.borderColor='#F75C54';setTimeout(()=>el.style.borderColor='',2000);}
    });
    showToast('Bitte Weingut oder Weinname eingeben');
    return;
  }
  const name=weingut?(weinname?`${weingut} ${weinname}`:weingut):weinname;
  const editId=parseInt(document.getElementById('screen-add').dataset.editId||'0');
  const id=editId||Date.now();
  document.getElementById('screen-add').dataset.editId='';
  const wine={id,name,weingut,weinname,vintage:document.getElementById('f-vintage').value.trim(),type:document.getElementById('f-type').value,grape:document.getElementById('f-grape').value.trim(),alc:document.getElementById('f-alc').value.trim(),country:document.getElementById('f-country').value.trim(),region:document.getElementById('f-region').value.trim(),lage:document.getElementById('f-lage').value.trim(),klass:document.getElementById('f-klass').value.trim(),soil:document.getElementById('f-soil').value.trim(),aroma:document.getElementById('f-aroma').value.trim(),notes:document.getElementById('f-notes').value.trim(),rating:editRating,price:parseFloat(document.getElementById('f-price').value)||0,date:document.getElementById('f-date').value,ort:document.getElementById('f-ort').value.trim(),format:document.getElementById('f-format').value,drinkFrom:document.getElementById('f-from').value.trim(),drinkTo:document.getElementById('f-to').value.trim(),link:document.getElementById('f-link').value.trim()};
  await dbPut('wines',wine);
  if(currentPhotoB64)await dbPut('photos',{id,data:currentPhotoB64});
  // Update or insert in wines array
  const idx=wines.findIndex(w=>w.id===id);
  if(idx>=0)wines[idx]=wine; else wines.unshift(wine);
  currentPhotoB64=null;
  renderAll();
  goList();
  showToast('Wein gespeichert ✓');
}

function getRegionInfo(country,region){
  const key=`rinfo_${country}_${region}`;
  const saved=localStorage.getItem(key);
  if(saved)return JSON.parse(saved);
  const r=(SVG_REGIONS[country]?.regions||[]).find(x=>x.id===region);
  return{grape:r?.grape||'',soil:r?.soil||'',desc:r?.desc||'',klass:r?.klass||''};
}
function saveRegionInfo(country,region,grape,soil,desc,klass){
  localStorage.setItem(`rinfo_${country}_${region}`,JSON.stringify({grape,soil,desc,klass}));
}

function showStaticRegionMap(countryName){
  const container=document.getElementById('map-svg-container');if(!container)return;

  container.style.height='auto';
  container.style.minHeight='280px';
  const cw=getCountryWines();
  const myR=new Set((cw[countryName]||[]).map(w=>w.region).filter(Boolean));
  const hasW=id=>[...myR].some(mr=>mr.toLowerCase().includes(id.toLowerCase())||id.toLowerCase().includes(mr.toLowerCase()));

  // Pinterest 2026 palette: Wasabi #E9F056, Orange Topaze #F75C54, Cool Blue #D7EFFF, Cassis #351E28, Vert Sauge #AEB8A0 + warm sand #C4A882 + peach #F7A07A
  const PL={W:'#E9F056',O:'#F75C54',C:'#D7EFFF',K:'#351E28',V:'#AEB8A0',S:'#C4A882',P:'#F7A07A'};

  const TC={[PL.W]:'#2a2a10',[PL.O]:'#fff',[PL.C]:'#1a2a3a',[PL.K]:'#fff',[PL.V]:'#1a2a1a',[PL.S]:'#2a1a08',[PL.P]:'#3a2010'};

  function svg(vb,W,H,outline,regions,cities,extras){
    const esc=s=>s.replace(/'/g,"\\'");
    // Adaptive font size based on region area
    const fs=r=>{
      const nums=(r.d.match(/[\d.]+/g)||[]).map(Number);
      const xs=nums.filter((_,i)=>i%2===0),ys=nums.filter((_,i)=>i%2===1);
      if(!xs.length)return 0;
      const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
      const a=w*h;
      return a>2500?5.5:a>1000?4.8:a>400?4.2:a>150?3.8:0;
    };
    return`<svg viewBox="${vb}" width="100%" style="display:block;max-width:100%">
    <defs>${regions.map(r=>`<clipPath id="cp${r.id.replace(/[^a-zA-Z0-9]/g,'_')}"><path d="${r.d}"/></clipPath>`).join('')}</defs>
    <rect width="${vb.split(' ')[2]}" height="${vb.split(' ')[3]}" fill="#120B10"/>
    ${outline}

function loadD3AndDraw(){
  if(d3Loaded&&topoLoaded&&worldData){drawWorldMap();return;}
  const loadScript=(src)=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  const scripts=[];
  if(!d3Loaded)scripts.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js').then(()=>{d3Loaded=true;}));
  if(!topoLoaded)scripts.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js').then(()=>{topoLoaded=true;}));
  Promise.all(scripts).then(()=>{
    if(worldData){drawWorldMap();return;}
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')

function drawWorldMap(){
  currentDrillCountry=null;
  const container=document.getElementById('map-svg-container');if(!container)return;
  const loading=document.getElementById('map-loading');if(loading)loading.style.display='none';
  const W=container.getBoundingClientRect().width||container.offsetWidth||360;const H=280;
  if(W<10){setTimeout(drawWorldMap,100);return;}
  const countryWines=getCountryWines();
  const wineIsos=new Set(Object.keys(countryWines).map(n=>NAME_ISO[n]).filter(Boolean));
  container.innerHTML='';
  const svg=d3.select(container).append('svg').attr('width',W).attr('height',H).style('display','block');
  _mapSvg=svg;
  const projection=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  _mapProjection=projection;
  const path=d3.geoPath().projection(projection);
  _mapPath=path;
  const zoom=d3.zoom().scaleExtent([1,10]).on('zoom',e=>{
    g.attr('transform',e.transform);
    const k=e.transform.k;
    g.selectAll('circle.wine-marker').attr('r',3/k).attr('stroke-width',1/k);
  });
  _mapZoom=zoom;svg.call(zoom);
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#120B10');
  const g=svg.append('g');_mapG=g;
  const countries=topojson.feature(worldData,worldData.objects.countries);
  g.selectAll('path.country').data(countries.features).join('path').attr('class','country').attr('d',path)
    .attr('fill',d=>{const iso=String(d.id);return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'#8b1a2e':'#d8d0c5';})
    .attr('stroke','#fff').attr('stroke-width',0.4)
    .style('cursor',d=>{const iso=String(d.id);return(wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0')))?'pointer':'default';})
    .on('click',(event,d)=>{
      const iso=String(d.id);const name=ISO_NAMES[iso]||ISO_NAMES[iso.padStart(3,'0')];
      if(!name||!countryWines[name])return;
      if(SVG_REGIONS[name])zoomThenStatic(d,name,path,svg,g,zoom,W,H,countryWines);
      else zoomToCountry(d,name,path,svg,g,zoom,W,H,countryWines);
    });
  g.selectAll('circle.wine-marker').data(countries.features.filter(d=>{const iso=String(d.id);return wineIsos.has(iso)||wineIsos.has(iso.padStart(3,'0'));}))
    .join('circle').attr('class','wine-marker')
    .attr('cx',d=>{try{const c=path.centroid(d);return isNaN(c[0])?0:c[0];}catch(e){return 0;}})
    .attr('cy',d=>{try{const c=path.centroid(d);return isNaN(c[1])?0:c[1];}catch(e){return 0;}})
    .attr('r',3).attr('fill','#fff').attr('stroke','#8b1a2e').attr('stroke-width',1).style('pointer-events','none');
  document.getElementById('map-back-btn').style.display='none';
  document.getElementById('map-breadcrumb').style.display='none';
  document.getElementById('map-region-detail').style.display='none';
  renderCountryList(countryWines);
}

function zoomThenStatic(feature,countryName,path,svg,g,zoom,W,H,countryWines){
  currentDrillCountry=countryName;
  try{
    const [[x0,y0],[x1,y1]]=path.bounds(feature);if(isNaN(x0))return;
    const scale=Math.min(8,0.78/Math.max((x1-x0)/W,(y1-y0)/H));
    const cx=(x0+x1)/2,cy=(y0+y1)/2;
    svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2-scale*cx,H/2-scale*cy).scale(scale))
      .on('end',()=>setTimeout(()=>showStaticRegionMap(countryName),100));
  }catch(e){showStaticRegionMap(countryName);}
  document.getElementById('map-back-btn').style.display='block';
  const bc=document.getElementById('map-breadcrumb');
  bc.textContent=`${COUNTRY_FLAGS[countryName]||''} ${countryName} — Region antippen`;bc.style.display='block';
  setTimeout(()=>{
    document.querySelectorAll('.map-country-card').forEach(card=>{
      if(card.dataset.country===countryName){card.querySelector('.map-country-wines').classList.add('open');card.scrollIntoView({behavior:'smooth',block:'start'});}
    });
  },700);
}

function zoomToCountry(feature,countryName,path,svg,g,zoom,W,H,countryWines){

    const [[x0,y0],[x1,y1]]=path.bounds(feature);if(isNaN(x0))return;
    const scale=Math.min(8,0.8/Math.max((x1-x0)/W,(y1-y0)/H));
    const cx=(x0+x1)/2,cy=(y0+y1)/2;

}

// Swipe back on detail screen
(function(){
  // Robust swipe-back for all screens
  let _sx=0,_sy=0,_sActive=false;

  function _getActiveBack(){
    if(document.getElementById('screen-detail').classList.contains('active')) return goList;
    if(document.getElementById('screen-add').classList.contains('active')) return cancelAdd;
    // Check filtered wine list with back button visible
    const backBtn=document.querySelector('#tab-liste .btn-ghost');
    if(backBtn&&document.getElementById('tab-liste').style.display!=='none') return backToHome;
    return null;
  }

  document.addEventListener('touchstart',e=>{
    const fn=_getActiveBack();
    if(!fn)return;
    _sx=e.touches[0].clientX;
    _sy=e.touches[0].clientY;
    _sActive=_sx<40; // only trigger if starting from left edge (0-40px)
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!_sActive)return;
    const dx=e.touches[0].clientX-_sx;
    if(dx>10){
      // Show subtle swipe indicator
      const app=document.getElementById('app');
      app.style.transform=`translateX(${Math.min(dx*0.3,40)}px)`;
      app.style.transition='none';
    }
  },{passive:true});

  document.addEventListener('touchend',e=>{
    const app=document.getElementById('app');
    app.style.transform='';
    app.style.transition='transform .2s ease';
    setTimeout(()=>app.style.transition='',200);

    if(!_sActive){_sActive=false;return;}
    const dx=e.changedTouches[0].clientX-_sx;
    const dy=Math.abs(e.changedTouches[0].clientY-_sy);
    _sActive=false;
    if(dx>50&&dy<80){
      const fn=_getActiveBack();
      if(fn)fn();
    }
  },{passive:true});
})();

function exportJson(){
  const blob=new Blob([JSON.stringify(wines,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='weinbuch-backup.json';a.click();URL.revokeObjectURL(url);
}

async function importJson(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)&&d.length>0){
        if(confirm(`${d.length} Weine importieren?`)){
          for(const w of d)await dbPut('wines',w);
          wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
          goList();alert('Import erfolgreich!');
        }
      }
    }catch{alert('Ungültige Datei');}
  };
  r.readAsText(file);
}

function getAllRebsorten(){
  const saved=localStorage.getItem('rb_custom');
  const custom=saved?JSON.parse(saved):[];
  const all=[...DEFAULT_REBSORTEN,...custom];
  return all.sort((a,b)=>a.name.localeCompare(b.name,'de'));
}

function saveCustomRebsorte(rb){
  const saved=localStorage.getItem('rb_custom');
  const custom=saved?JSON.parse(saved):[];
  const idx=custom.findIndex(r=>r.name===rb.name);
  if(idx>=0)custom[idx]=rb; else custom.push(rb);
  localStorage.setItem('rb_custom',JSON.stringify(custom));
}

function deleteCustomRebsorte(name){
  const saved=localStorage.getItem('rb_custom');
  const custom=saved?JSON.parse(saved):[];
  localStorage.setItem('rb_custom',JSON.stringify(custom.filter(r=>r.name!==name)));
}

function isCustomRebsorte(name){
  const saved=localStorage.getItem('rb_custom');
  const custom=saved?JSON.parse(saved):[];
  return custom.some(r=>r.name===name);
}

const AC_FIELDS={
  grape:w=>w.grape,region:w=>w.region,country:w=>w.country,
  lage:w=>w.lage,klass:w=>w.klass,soil:w=>w.soil
};

function acGetSuggestions(field,query){
  const getter=AC_FIELDS[field];if(!getter)return[];
  const q=query.toLowerCase().trim();
  const all=[...new Set(wines.map(getter).filter(Boolean))].sort();
  if(!q)return all.slice(0,6);
  return all.filter(v=>v.toLowerCase().includes(q)).slice(0,8);
}

function acHighlight(text,query){
  if(!query)return text;
  const idx=text.toLowerCase().indexOf(query.toLowerCase());
  if(idx<0)return text;
  return text.slice(0,idx)+`<strong>${text.slice(idx,idx+query.length)}</strong>`+text.slice(idx+query.length);
}

function acShow(input,field){
  const q=input.value;
  const suggestions=acGetSuggestions(field,q);
  const dd=document.getElementById('ac-'+field);if(!dd)return;
  if(!suggestions.length){dd.classList.remove('show');return;}
  dd.innerHTML=suggestions.map(s=>`<div class="ac-item" onmousedown="acSelect('${field}','${s.replace(/'/g,"\\'")}');return false">${acHighlight(s,q)}</div>`).join('');
  dd.classList.add('show');
}

function acHide(field){
  setTimeout(()=>{const dd=document.getElementById('ac-'+field);if(dd)dd.classList.remove('show');},150);
}

function acSelect(field,value){
  const input=document.getElementById('f-'+field);if(input)input.value=value;
  const dd=document.getElementById('ac-'+field);if(dd)dd.classList.remove('show');
}

init();

// ── Google Drive Sync ──────────────────────────────────────────────
const GAPI_CLIENT_ID='399210738927-kr0dkpovdkrr8ugiqv7vcr43oggagjj2.apps.googleusercontent.com';
const GAPI_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME='weinbuch-data.json';
let gapiReady=false;let gisReady=false;let tokenClient=null;let driveFileId=null;

function loadGoogleLibs(){
  const s1=document.createElement('script');s1.src='https://apis.google.com/js/api.js';
  s1.onload=()=>{gapi.load('client',async()=>{await gapi.client.init({});gapiReady=true;checkSyncReady();});};
  document.head.appendChild(s1);
  const s2=document.createElement('script');s2.src='https://accounts.google.com/gsi/client';
  s2.onload=()=>{tokenClient=google.accounts.oauth2.initTokenClient({client_id:GAPI_CLIENT_ID,scope:GAPI_SCOPE,callback:onTokenResponse});gisReady=true;checkSyncReady();};
  document.head.appendChild(s2);
}

function checkSyncReady(){
  if(gapiReady&&gisReady){
    updateSyncUI('bereit');
    const saved=localStorage.getItem('wt_gdrive_token');
    if(saved){gapi.client.setToken(JSON.parse(saved));updateSyncUI('verbunden');syncFromDrive();}
  }
}

function onTokenResponse(resp){
  if(resp.error){updateSyncUI('fehler');return;}
  localStorage.setItem('wt_gdrive_token',JSON.stringify(gapi.client.getToken()));
  updateSyncUI('verbunden');
  syncFromDrive();
}

function connectDrive(){
  if(!gapiReady||!gisReady){alert('Google lädt noch, kurz warten.');return;}
  tokenClient.requestAccessToken({prompt:'consent'});
}

function disconnectDrive(){
  const token=gapi.client.getToken();
  if(token){google.accounts.oauth2.revoke(token.access_token,()=>{});}
  gapi.client.setToken(null);
  localStorage.removeItem('wt_gdrive_token');
  driveFileId=null;
  updateSyncUI('bereit');
}

async function syncToDrive(){
  if(!gapi.client.getToken()){return;}
  updateSyncUI('sync');
  try{
    const data=JSON.stringify(wines);
    const meta={name:DRIVE_FILE_NAME,parents:['appDataFolder']};
    if(!driveFileId)await findDriveFile();
    if(driveFileId){
      await gapi.client.request({path:`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}`,method:'PATCH',params:{uploadType:'media'},body:data,headers:{'Content-Type':'application/json'}});
    } else {
      const boundary='weinbuch_boundary';
      const body=`--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${boundary}--`;
      const resp=await gapi.client.request({path:'https://www.googleapis.com/upload/drive/v3/files',method:'POST',params:{uploadType:'multipart'},body,headers:{'Content-Type':`multipart/related; boundary=${boundary}`}});
      driveFileId=resp.result.id;
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('fehler');
  }
}

async function syncFromDrive(){
  if(!gapi.client.getToken())return;
  updateSyncUI('sync');
  try{
    await findDriveFile();
    if(!driveFileId){updateSyncUI('verbunden');return;}
    const resp=await gapi.client.request({path:`https://www.googleapis.com/drive/v3/files/${driveFileId}`,params:{alt:'media'}});
    const driveWines=typeof resp.result==='string'?JSON.parse(resp.result):resp.result;
    if(Array.isArray(driveWines)&&driveWines.length>0){
      const localIds=new Set(wines.map(w=>w.id));
      const toAdd=driveWines.filter(w=>!localIds.has(w.id));
      for(const w of toAdd)await dbPut('wines',w);
      if(toAdd.length>0){
        wines=await dbGetAll('wines');wines.sort((a,b)=>b.id-a.id);
        renderAll();
      }
    }
    updateSyncUI('ok');
  }catch(e){
    if(e.status===401){gapi.client.setToken(null);localStorage.removeItem('wt_gdrive_token');updateSyncUI('bereit');}
    else updateSyncUI('verbunden');
  }
}

async function findDriveFile(){
  const resp=await gapi.client.request({path:'https://www.googleapis.com/drive/v3/files',params:{spaces:'appDataFolder',q:`name='${DRIVE_FILE_NAME}'`,fields:'files(id,name)'}});
  const files=resp.result.files||[];
  driveFileId=files.length>0?files[0].id:null;
}

function updateSyncUI(state){
  const btn=document.getElementById('sync-btn');
  const dot=document.getElementById('sync-dot');
  if(!btn||!dot)return;
  const states={
    bereit:{dot:'#b8860b',label:'Drive verbinden',disabled:false},
    verbunden:{dot:'#2d5a27',label:'Drive verbunden',disabled:false},
    sync:{dot:'#185fa5',label:'Synchronisiert…',disabled:true},
    ok:{dot:'#2d5a27',label:'Gespeichert ✓',disabled:false},
    fehler:{dot:'#a32d2d',label:'Fehler',disabled:false},
  };
  const s=states[state]||states.bereit;
  dot.style.background=s.dot;
  btn.textContent=s.label;
  btn.disabled=s.disabled;
  if(state==='ok')setTimeout(()=>updateSyncUI('verbunden'),2500);
}

const _origSaveWine=saveWine;
saveWine=async function(){await _origSaveWine.apply(this,arguments);setTimeout(syncToDrive,500);};
const _origDeleteWine=deleteWine;
deleteWine=async function(){await _origDeleteWine.apply(this,arguments);setTimeout(syncToDrive,500);};

loadGoogleLibs();
